front:
  text: 重刊王氏醫案三編序嘗聞有是病即有是藥但些小之病臟氣固有抵抗病菌之能力雖不藥亦能自愈若偶遇疑難危症認為寒者必投熱認為熱者必投寒認為虛者必投補認為實者必投瀉雖廣延諸醫於一堂其主見必各是其是際此吉凶反掌之時反令人茫無適從甚至日易多醫不問寒涼補瀉遇藥即投直至氣絶人亡病家亦竟委之於壽命聽之於大數嗚呼興言及此不勝扼腕詎知皆由後人學識未精審證不確之誤耳苟能推尋奧妙研究精微博覽前人醫案參察脈理一思百慮感而遂通鮮有不能取效者俞桂庭先生云醫理深微非上智不能討究以百人習醫無十人成就成就之中無一人精通得一明醫談何容易然事在人為貴乎自立如王甥孟英之鋭志於醫也足不出戶者十年手不釋卷者永夜邇年在婺屢起沉疴余每聞而喜躍所有歷年治驗曾令其須存底稿史縉臣先生亦云無論內外大小一年之中豈無一二奇證若懷之於胸臆則近於祕道不傳何不將所治奇病現何證服何藥如何療如何愈以為醫案使後人有跡可循而無識認不真之憾俞氏又云縉臣先生亦有此話可謂先得我心世之為醫者遵史氏之格言效吾甥之苦志出而問世必可加人一等也孟英之留存案可謂承舅氏之遺訓遵史氏之格言久而行之漸積成卷逮癸卯冬周君光遠選刊自道光甲申迄癸卯醫案二卷曰回春録張君柳吟等復集甲辰至庚戌醫案七卷題曰仁術志咸豐丁亥春楊大令素園重為刪定詳加評點附霍亂於後合梓於江西改題曰王氏醫案正續編總刊於江浙久已膾炙人口後如徐君亞枝等續採自辛亥至咸豐甲寅之驗案亦名王氏醫案三編然仍編年之例以期遞增無已也又如乙卯至丁巳醫案由先生自編即歸硯録之卷四是也其餘驗案散見於古今醫案按選及洄溪醫案名醫類案者亦不少惟醫案三編及歸硯録刻於潛齊十種之末原版已遭兵燹且後無翻印行世故流傳甚稀民國元年李氏校刊潛齊八種亦未採此二種余於丁巳秋偶在舊書肆得潛齊十種備重價購歸恐再散佚為此即謀石印並增王案正續編冠於三編前俾相接續而成全璧余嘗讀先生案益佩先生敏而好學嘗寢饋於醫學更能參究性理諸書以格物窮理故審病辨證能探虛實察淺深權緩急每多創闢之處然仍根據古書其裁方用藥無論用補用瀉皆不離運樞機通經絡能以輕藥愈重證為自古名家所未達者更有自始至終一法到底不更方而愈者良由讀書多而能融會貫通悟超象外故楊氏有云王氏醫案議論精透前無古人周氏謂其治病若天授皆不易之定評也中華民國七年二月四明後學曹炳章赤電氏序於古越之養性廬半癡山人醫案三編序山人王君孟英名士雄嘗經宜黃令楊君素園刻其醫案續編余既序之矣今同人復刊醫案三編以諗於余余謂山人蓋隱君子也托於醫以資事育耳不可僅以醫目之山人有夙慧書一覽即領解十歲知三黨五服之別通算術十四失怙衣食於奔走不喜時藝暇則泛覽史籍古文詞或勸以博功名嘆曰功名何必勢位哉顏其室曰潛齊父嘗誡山人曰為人必期有用於世山人志之不忘因思有用莫如濟世濟世莫如良醫遂研究軒岐之學未冠即能瘳劇疾不懸壺不受扁遇瀕危之證人望而卻走者必竭思以拯焉人皆癡之山人曰我於世無所溺而獨溺於不避嫌怨以期愈疾是尚有半點癡心耳因自號半癡凡人有所求力能者必應之其心交趙君菊齊知之深謂山人有數善焉其貧而業醫也有所得必獻之母不私之於妻其弟性拙闢一業造就之俾成材得贍其室家此古人子婦無私兄弟同財之義其待友也久要不忘平生之言能治生而無餘資曰祖父家風如是幼孤貧而不填溝壑幸矣其守道輕利有如此然則吾之所以重山人者非驚其絶技之工而欽其內行之篤也君子先德行而後材藝其成而下者有成而上者為之主也昔朱君震亨以醫名一世而遊於白雲先生之門元史且進而附於道學傳吾願山人敦行不怠將見學益懋而業益充不以方技自域以媲美於丹溪則固吾之所深望哉咸豐四年秋日秀水莊仲方書時年七十有五
