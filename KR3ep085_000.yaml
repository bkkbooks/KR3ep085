body:
  text: 題王氏醫案三編王君半癡讀書好學雅尚氣節而隱於醫者也與余交有年論事知本末而洞中竅要壬子秋余病痢幾殆君活之今又三年矣承以所刻初二三編醫案十三篇見示讀之皆道其平生閲歷之艱苦與病情之百出其變以相嘗試而君顧能以一心之靈明疏瀹臟腑使藥無不及病病無不受治於藥何醫之神哉從古聖賢著書垂世大抵出於不得已之苦心而非僅以博一時之譽求千載之名也自素問難經及漢唐宋元明以來其可傳不朽之醫書醫案藏之祕府流傳世間者不過數百十家知其久而湮沒無聞者多矣君之所著其殆有不得已之苦心而足以不朽於世也與憶君制服中有貴人延之治病老耄多忌諱欲君易服而進君怫然去之其守節不阿如此余不知醫而能知君之為人與其所用心故樂為述之者君即以此為是書之辨言則有玷君書矣惡乎可咸豐甲寅閏月仁和朱瑞菘生甫書
