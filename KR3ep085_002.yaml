body:
  text: 卷二壬子春沈峻揚年五十七歲素患痰嗽年前顧某與小青龍湯一劑喘逆漸甚汪某進腎氣湯一服勢更瀕危醫云治實治虛不能捨此二法而皆不應病真藥假不可為矣王月鉏囑迎孟英圖之脈來虛弦軟滑尺中小數顴紅微汗吸氣不能至腹小便短數大解甚艱舌紅微有黃苔而渴不多飲胸中痞悶不舒曰根蒂虛於下痰熱阻於上小青龍治風寒挾飲之實喘腎氣湯治下部水泛之虛喘皆為仲景聖法用之得當如鼓應桴用失其宜亦同操刃所以讀書須具隻眼辨證尤要具隻眼也此證下雖虛而肺不清肅溫補反助其壅塞上雖實而非寒飲溫散徒耗其氣液耗之於先則虛氣益奔壅之於後則熱痰愈錮其加病也不亦宜乎爰以杏仁葦莖紫菀白前蔞仁竹瀝開氣行痰以治上實而佐蓯蓉胡桃仁以攝納下焦之虛陽一劑知再劑平旋去紫菀白前加枸杞麥冬白石英服三帖而便暢溺長即能安穀再去杏仁竹瀝葦莖加熟地當歸薏苡巴戟填補而痊陳舜廷繼室娩後略有咳嗽微有寒熱惡露不多少腹似有聚瘕時覺竄痛腰疼不能反側齒衄頻流溺少口乾仍不喜飲舌色無液善怒不眠四肢牽掣不舒易於出汗逆孟英診之脈至虛弦細弱系素屬陰虧新産血去之後八脈皆空陽不能潛遊行於上見證雖然錯雜治當清息風陽表散攻瘀毫不可犯爰以沙參竹茹白薇丹參絲瓜絡石斛梔子小麥甘草紅棗藕為方服數帖嗽衄皆蠲為去丹參麥棗梔斛加歸身熟地枸杞麥冬楝實服之各恙漸瘥復因卒聞驚嚇之聲心悸自汗肢麻欲厥乃定集靈膏加紫石英牡蠣龍齒合甘麥大棗熬膏服之而康繼有汪少洪令侄女適孫彬士者産後患證與此相似誤投溫散發熱愈壯但在上部醫者猶不知為陰虛陽越仍從感治逮脈脫汗淋始邀孟英視之始知是虛陽外越然已不能拯救病者自賦絶命詞而逝蓋凡屬虛脫之證至死而神不昏也醫者識之許蘭嶼令正正月中旬偶食蒸餅即覺腹中攻痛而寒熱間作以為瘧也請孟英診之脈弦軟而微數曰此不可以瘧論緣營素虧往歲愈後少於調補仍當濡養奇經蓋陽維為病亦能作寒熱而八脈隸於肝腎溫腎涼肝病即霍然矣授以蓯蓉枸杞當歸白薇青蒿茯苓竹茹鱉甲楝實藕數帖果愈逮二月中旬其病復作舉家僉以為瘧或云必前次早補留邪未去使然而蘭嶼遠出家無主議之人孟英曰前次愈之太易我之罪也不為善後誰之過歟如信我言指日可瘳第須多服培養之劑保無後患於是仍服前藥亦數劑而安續以集靈膏去牛膝加羊藿阿膠當歸黃柏菟絲蓯蓉蒲桃干熬膏服之竟不再發張友三室去春受孕後忽夢見其亡妹而妹之亡也由於娩難心惡之因囑婢溫輩廣購墮胎藥餌服卒無驗冬間娩子後亦無恙自疑多餌墮胎藥元氣必傷召朱某治之述其故朱即迎合其意而斷為大虛之候且云苟不極早補救恐延蓐損病者聞而益懼廣服補劑漸至臥榻不起多藥弗效延至仲春族人張鏡江為邀孟英視之不飢不寐時或氣升面赤口乾二便祕澀痰多易汗胸次如舂咽有炙臠畏明善怒刻刻怕死哭笑不常脈至左部弦數右手沉滑曰此郁痰證誤補致劇也與上年李健伯令正之病情極相類第彼已年衰而傷於憂思謀慮是為虛郁此年壯體堅而成於驚疑惑懼是為實郁虛郁不為舒養而輒投溫補則鬱者愈郁而虛者愈虛實郁不為通泄而誤施溫補則鬱不能開而反露虛象所謂大實有羸狀也醫者但云補藥日投虛象日著不知虛象日形病機日錮彼豈故釀其病而使之深耶亦是一片仁心無如藥與病相僢而馳蓋即好仁不好學之謂耳余非好翻人案恐不為此忠告未必肯舍補藥而從余議也病者聞之大悟即授小陷胸合雪羹加菖蒲薤白竹茹知母梔子枳實旋赭出入為方吞當歸龍薈丸三劑後蔞仁每帖用至八錢而大解始行各恙乃減半月後心頭之舂杵始得全休改用清肅濡養之法調理匝月汛至而痊蔣禮園三令弟拜楓自去年瘧後左脅聚氣不消時時竄痛疑為瘧母孟英脈之弦軟且滑曰非瘧母也豫旋覆海石竹茹絲瓜絡絳屑蔥白蛤殼鳧茈海虴為方十餘劑而刈其根關寅伯贊府家某廚患春溫渠主人穎庵治之弗瘳為速孟英診焉脈來弦軟而寸數舌絳苔黑而神昏譫渴溺紅胸腹拒按是雙傳證也夫順傳者宜通其胃逆傳者宜清其營治法不容紊也然氣血流通經絡貫串邪之所湊隨處可傳其合其分莫從界限故臨證者宜審病機而施活變弗執死法以困生人此證屬雙傳即當雙解豫涼膈散加犀角菖蒲元參下之果愈何氏婦年未四旬於庚戌冬患腹脹善嘔或云寒凝氣滯宜吸鴉片煙以溫運之及煙癮既成而病如故或云冷積也莫妙於蒜罨往夏遂以蒜杵如泥遍塗脊骨名曰水灸灸後起疱痛潰骨蒸減餐其脹反加經乃漸斷招越醫莊某治之云勞損也進以溫補病乃日甚復邀張鳳喈包次橋姚益齋諸人視之僉云勞損已成或補陰或補陽服至冬令便瀉不飢骨立形消臥床不起今春請神方於各乩壇皆云不治其夫因蒲艾田薦於許信臣學使隨任廣東家無主意束手待斃而已蒲聞而憐之為屈孟英一診以決危期之遲速初無求愈之心也切其脈弦細數循其尺索刺粗舌絳無津飲而不食兩腿腫痛攣不能伸痰多善怒腹脹堅高上膚黃粗循之戚戚然晝夜殿屎愁容黎瘁小溲短澀而如沸大便日瀉十餘行脈色相參萬分棘手惟目光炯炯音朗神清是精氣神之本實未撥病雖造於極中之極卻非虛損之末傳也殆由木土相凌為嘔為脹洋煙提澀其氣益令疏泄無權蒜灸劫耗其陰更使郁攸內爍進以溫補徒為壯火豎幟而涸其津溉以滋填反致運化無權而釀為瀉固之澀之煞費苦心余謂賴有此瀉尚堪消受許多補劑縱臨證心粗不詢其瀉出之熱而且膩豈有腎虛脾敗之瀉可以久不安穀而延之至今乎夫人氣以成形耳法天行健本無一息之停而性主疏泄者肝也職司敷布者肺也權衡出納者胃也運化精微者脾也咸以氣為用者也肝氣不疏則鬱而為火肺氣不肅則津結成痰胃氣不通則廢其容納脾氣不達則滯其樞機一氣偶愆即能成病推諸外感理亦相同如酷暑嚴寒人所共受而有病有不病者不盡關乎老小強弱也以身中之氣有愆有不愆也愆則邪留著而為病不愆則氣默運而潛消調其愆而使之不愆治外感內傷諸病無餘蘊矣今氣愆其道津液不行血無化源人日枯瘁率投補藥更阻氣機是不調其愆而反錮其疾也疾日錮腹愈脹氣日愆血愈枯或以為乾血勞或以為單腹脹然汛斷於腹脹半年之後是氣愆而致血無以化非血病而成脹矣既脹而馴致腿腫筋攣不可謂之單脹矣腫處裂有血紋堅如鱗甲顯為熱壅不屬虛寒借箸而籌氣行則熱自泄首重調愆展以輕清忌投剛燥熱泄則液自生佐以養血須避滋膩宜取流通徐洄溪所謂病去則虛者亦生病留則實者亦死勿以藥太平淡而疑其不足以去病也艾田云薛一瓢謂人須修到半個神仙身分才可當得名醫二字聆君妙論不愧名醫於是以沙參竹茹絲瓜絡銀花楝實枇杷葉冬瓜皮黃柏當歸麥冬枸杞白芍出入為方用水露煮葦莖藕湯煎藥服四劑脈柔溲暢瀉減餐加乃參以西洋參生地黃連花粉薏苡梔子之類又六劑舌色漸淡腿腫漸消服至匝月忽然周身汗出溱溱而腫脹皆退舌亦津潤皮膚漸脫肌肉漸生足亦能伸便溺有節並不另授峻補兩月後可策杖而行矣天時漸熱服藥已久以虎潛丸方熬為膏用藕粉溲搗成丸因丸劑皆藥之渣質脾運殊艱孟英凡治陰虛須滋補者悉熬取其精華而以可為佐使者和之為丸不但藥力較優亦且餌之易化如法服至長夏健步經通遂以康復艾田云此證人不能治神亦不能治君竟能肉白骨而生之不僅半個神仙殆人而仙者耶抑仙而降為人者耶水露以甜水貯甑蒸取其露宜臨時蒸用取其有升降之機而養津液也一名甑汗水停久則失性矣應氏婦年逾四旬去年難産後患左目無光火升心悸諸治不效所親沈玉庭囑延孟英治之豫集靈膏合甘麥大棗湯以峻滋肝腎之陰而愈一機匠久患寒熱兼以痰嗽形消肌削人皆以勞怯治之久而不愈或囑其就診於孟英脈弦緩而大畏冷異常動即氣逆時欲出汗暮熱從骨髓中出痰色緑而且臭便堅溺赤曰痰火為患耳誤投補藥矣以葦莖湯合雪羹加白薇花粉旋覆蛤殼服二十劑體健加餐其病如失諸暨張某者有跛疾業點翠終日坐而三四年來行數十武即喘不能已別無他苦飲食如常醫咸謂虛頻補不應詣孟英視之曰久坐不勞氣行遲滯痰凝久伏故為此患脈緩而滑豈為虛象授雪羹合小陷胸加竹茹旋覆海石杏仁半夏服之果吐多痰而愈高雋生孝廉令堂患痰嗽服傷風藥而喘汗欲脫孟英豫人參茯苓半夏甘草桂枝白石英牡蠣胡桃仁冬蟲夏草而瘳以其年近五旬衝任不足雖素有飲邪而悲哀勞瘁之餘經事忽行一投表散氣即隨而上逆故用藥如此孟夏許芷卿偶自按脈左寸如無招他醫診之僉云心散舉家驚懼己亦皇皇屈孟英視之曰勞心而兼痰火之郁故脈伏耳其火升面赤不寐脅鳴乃驚駭激動肝膽之陽勃然升越非本病也豫人參黃連菖蒲紫石英小麥麥冬蓮子心紅棗竹葉甘草為方一劑知二劑已蔣禮園令堂年七十三歲患瘧寒少熱多時時自汗咸慮其脫議欲進補孟英切脈洪數而滑舌絳口乾是暑為病也與清解法數劑而痊許子厚令庶母年未四旬患晡熱發於上焦心悸頭疼腰痠腿軟飢不欲食暮則目如盲而無所睹時或腹脹自汗帶多孟英脈之弦細而弱氣短不足以息舌赤無苔曰此營血大虧不可作暑治也授人參熟地棗仁枸杞歸身麥冬烏鰂骨牡蠣龜板蒺藜芍藥杜仲羊藿等藥數十劑而康復如常吳曲城三令郎年未冠患瘧醫作食瘧暑瘧陰虛瘧治之諸法不應逆孟英視之面色浮黃便溏嘔惡脘悶腹脹溺少汗多曰濕瘧也豫枳朴苓滑蒼朮半夏為方送服香連丸而愈繼用六君子善其後或云先生近輯溫熱經緯力辨暑必兼濕之非今年黴雨全無夏至後酷熱亢旱流金爍石濕自何來方嘆先生析理之精胡以此證是濕邪大劑燥藥果然獲效又何説歟孟英曰暑即天上之日有何濕氣人因畏暑貪涼瓜果過度雖無雨濕相雜濕亦自內而生所以暑每易於挾濕而昧者遂指濕熱相合之病為暑證殆由未見天日故不識暑之真面目也一笑蘭溪吳氏婦盛夏患惡阻洪某進旋覆薑桂等藥而壯熱神昏腰疼欲墮二便祕澀嘔吐不休脈數而洪豫梔芩連楝竹茹知母銀花緑豆為劑佐以蘇葉二分冬瓜煮湯煎藥下咽即安數服而愈張六橋年逾七旬素不耐病新秋患瘧托孟英籌速愈之方曰易事耳第寒少熱多苔黃渴汗溺赤便祕體厚多痰杳不知飢極其畏熱其年雖耄其證宜清以大劑知芩連滑花粉竹茹厚朴石膏加雪羹投之數劑而痊康強如昔吳奏云三令郎甫八齡患感幼科治以清解弗瘥迓孟英視之脘悶便祕曰氣機未展耳投小陷胸加紫菀通草杏仁服三劑先戰汗而解尋更衣以愈當戰解之時家人不知詫為將脫欲煎參湯灌之幸孟英適至阻其勿服既而其婦弟陳某之病略相似亦用此法而痊朱生甫明經以花甲之年偶在嘉興患滯下甚劇急買棹旋杭集諸醫議治許敬齋宗景嶽謂痢必本於寒濕主幹薑桂朴以溫化洪石生尚東垣聞其向患脫肛主清暑益氣以舉陷或云素善飲而有鼻衄血熱陰虧既受暑邪宜玉女法以兩清或云痢必有積不必問其餘宜大黃歸枳以蕩滌聚議紛紜乃郎仲和等不知所從而質諸孟英診畢遂問此證何如當用何藥曰此滯下證之最難治者也痢初作即不能起於榻而五色並見噤口不食非暑熱之深受一何至於此極耶滿面紅光鼻赤尤甚肺熱素熾暑火爍金故水失化源溺少而澀此不可以溫燥再劫其津也肢掣無眠合目囈語時時煩躁視物不明畏熱喜風口乾易汗陽氣浮越暑漸侵營故苔雖膩黃尖紅根黑此不可以升散再擾其陽也胸次不舒飲水欲噎欲噫不達欲嚏不能莖縮易嗔時有惡夢肝多怫鬱痰阻清陽故升降不調中樞窒滯此不可以滋澀再礙其機也又非尋常之痢病僅在府可以推蕩以為功也參之於脈右寸關緩滑而寸較抑左則弦洪而數兼上溢故知其氣鬱痰凝暑火深受風陽內動久耗心營所幸兩尺皆平身無大熱如能治之中肯儘可無虞仲和出諸方云然則此皆不可服乎曰咸治痢之法也惜尊翁之證不能合於此藥耳若尊翁之恙見證雖太錯雜而責重在於肝經肝屬厥陰風火內寄故此經之痢宜柔宜涼忌剛忌溫以肝為角木龍性難馴變化飛騰病機莫測但使風陽靖息庶幾險浪不興縱有別脈未清自可徐為疏瀹也仲和聞而心折力懇圖維於是以仲聖白頭翁湯為主方加石菖蒲川貝母竹茹開痰舒郁以調其氣犀角銀花竹葉涼血息風以清其心冬瓜蔗梢鳧茈海虴煮湯煎藥以清胃熱而生津化府氣而濯垢吞送滋腎丸三十粒引肝火迅速下行服後諸恙遞減糞色漸見痰果頻吐神氣亦安既而粥食日增夜眠恬適始去犀角雪羹滋腎丸加西洋參阿膠以復其津液逮痢淨而時有血隨糞下為加鴉膽仁以龍眼肉包而吞之果止惟腸鳴氣泄稀糞隨流肛墜難收脈亦弦軟知其病去而正虛也改用三奇散而安繼豫氣血交培善後仍佐蠲痰舒郁康健較勝曩時蓋並其積年宿疾而去之也故生甫謝孟英詩五排結句云不因施上藥那得挽沉疴磈磊從今盡先生殆緩和趙菊齋外孫華穎官易患痰嗽幼科治之漸至發熱口渴便瀉汗多煩哭以為將成慢驚參入溫補日以加劇孟英視之曰肺熱也投葦莖湯加滑石黃芩枇杷葉桑葉地骨皮旬日而愈顧媼因比鄰失火幾焚其廬驚嚇之餘不能起榻脅痛偏右便祕神瞀身面發黃醫云濕熱治之罔效乞診孟英脈澀而弦按之甚軟曰此因驚恐氣結不行所致豫沙參桑葉梔子絲瓜絡冬瓜子葦莖枇杷葉旋覆蔥須竹茹數劑而痊金願谷中翰患便祕廣服潤劑糞黑而堅如彈丸必旬余始一更衣極其艱澀孟英診脈遲軟舌潤不渴小溲甚多乃久患痹證坐臥不行健運迂遲法宜補氣俾液濡布所謂中氣足則便溺如常矣非涼潤藥所能治也豫大劑參朮橘半加旋覆花以旋轉中樞雞膍胵以宣通大腸之氣雞不溺而糞易下也更仿金匱谷實之例佐血餘蓯蓉俾為流通府氣之先導如法服之數日即解且較暢潤至三十劑其病若失沈氏子年甫髫仲秋患感兩旬屢醫弗愈求孟英視之神昏譫語面慘無眠舌絳耳聾頻吐白沫脈數溺少渴飲不飢熱已甚微汗亦頻出牛黃紫雪數進無功以元參丹參白薇知母葦莖竹茹旋覆冬瓜子蛤殼石斛枇杷葉竹葉花粉蓮子心西瓜翠衣等出入為方數服而愈蓋邪雖傳營氣分未廓故雖善飲水而敷布無權不能下行為溺但能旁溢為汗上行為沫良由初起不知為暑治以表散風寒之藥及至傳營又不知營衛兩解之法徒以直走膻中之藥漫圖僥幸何異鸚鵡學人言而不知所以言耶沙沛生鹺尹患身熱頭重腹脹便溏脘悶不飢口流涎沫腿痠溺少脈軟神疲孟英診曰內濕素盛兼吸客邪不可謂值此亢旱之年竟無泛濫之病也豫檳朴蔻苓豬澤橘半防己秦艽之劑小溲雖行其口中涎水流出尤多病遂以愈既而其子龍官初次患瘧耳聾舌絳溺赤痰多脈數而弦寒微熱甚幼科云胎瘧不能即愈孟英曰此齊東野語也豫滑石竹茹知母花粉苓翹橘半青蒿鱉甲八帖而痊溫敬齋令正九月間忽然四肢麻木頭暈汗淋尋不能言目垂遺溺渾身膚冷急請孟英視之脈微弱如無乃虛風內動陽浮欲脫也先令煮水以待藥與東洋參黃耆龍牡桂枝甘草茯苓木瓜附子九味煎數沸隨陸續灌之未終劑人漸蘇蓋恐稍緩則藥不能追也朱飭庵孝廉年未三旬自都中奔喪回杭患滯下赤白腹不甚痛而奔迫異常能食溺長醫治罔效孟英脈之虛弦而軟曰此不可以常痢視也以三奇散加歸芎送香連丸而愈王子庵令堂年已古稀患便祕不舒時欲弩掙汗出頭暈醫謂其肝氣素滯輒與麻仁丸等藥其勢孔亟伊壻陳載陶屈孟英診焉脈虛弦而弱是虛風祕結豫人參蓯蓉當歸柏子仁冬蟲夏草白芍枸杞楝實胡桃仁數帖而痊次年秋患脘痞疼脹醫者率進溫補香燥之藥馴致形消舌絳氣結津枯始延孟英視之不及救矣屠小蘇令正自乳經停泛泛欲吐或疑為妊所親高嘯琴進以養陰之藥漸致時有微熱脘悶不飢氣逆嗽痰臥難著枕二便祕澀耳閉汗頻孟英脈之虛軟而澀曰根蒂素虧經停乳少血之不足泛泛欲嘔肝乘於胃率投滋膩窒滯不行略受風邪無從解散氣機痹塞九竅不和先以蔥豉通草射干兜鈴杏仁蔞殼枇杷葉白蔻開上兩劑熱退次用小陷胸合雪羹加竹茹旋覆白前紫菀宣中三劑便行安穀繼豫冬蟲夏草蓯蓉當歸枸杞麥冬紫石英楝實熟地牛膝滋下而瘳又顧氏子患發熱獨熾於頭醫進發散汗出不解胸次痞悶便滯溺艱舌絳口乾飲不下膈不眠頭痛脈數而弦孟英曰體質素虛熱薄於肺痰結於胸治宜輕解羌防柴葛惡可妄投膏粱與藜藿有殊暑熱與風寒迥異治上焦如羽展氣化宜輕以通草葦莖冬瓜子絲瓜絡紫菀枇杷葉射干兜鈴白前九味天泉水急火煎服覆杯即已蓋席豐履厚之家密室深居風寒濕三氣所不能侵惟暑燥之邪易於吸受誤用溫散最易劫津若田野農夫櫛風沐雨肌堅氣實當用辛溫設進輕清焉能濟事故醫者須量體以裁衣弗膠柱而鼓瑟也炳按汪謝城云覆杯即已下宜刪去以言過當也若然則藜藿人溫證暑證亦可用辛溫矣此評甚是孫氏子患腿痠寢汗溺赤脘疼食減口乾或疑為損孟英按脈緩大苔色微黃乃勞力火升內兼濕熱也以沙參竹茹甘草梢小麥石斛楝實絲瓜絡緑萼梅建蘭葉帶露桑葉為方送服松石豬肚丸旬日而愈嗣有任氏女校書患帶諸藥罔瘳孟英視曰脈軟數而長非虛也宜豬肚丸清其濕火服匝月病良已沈嫗素患肝氣初冬便瀉醫藥勿瘥所親吳馥齋迓孟英診之脈至弦梗舌赤無津杳不知飢脅腹時脹乃風陽內熾津液耗傷香燥忌投法宜濡潤否將陰涸毋畏甘涼豫甘草地黃麥冬阿膠枸杞薏苡楝實葳蕤烏梅為劑牡蠣一斤甘瀾水煮濃湯煎藥和入蔗漿服之數日而瘳已能安穀忽然舌不能伸心搖語蹇不眠頭暈面赤火升仍速請孟英視之脈梗雖和極其弦細是陰液未復木火失涵以前方去薏楝烏梅加人參龍眼肉少佐黃連授之而愈羅氏婦先患痰嗽氣逆礙眠後兼瘧痢並作醫者僉云無法浼人乞診於孟英脈見滑數口渴苔黃不飢脘悶溺似沸湯曰無恐也雖見三證其實一病蓋肺胃大腸一氣流通暑伏肺經始為痰嗽失於清解氣逆上奔溫納妄投胃樞塞滯郁遏成瘧渴飲汗多熱甚寒微病情畢露溫化再誤轉入大腸赤白稠黏無非熱迫不必見證治證但治其暑則源清流自潔矣以葦莖湯加滑石黃芩竹茹石膏厚朴授之不旬日而三證悉瘳沙沛生鹺尹令正胎前痰嗽娩後尤甚孟英視之面赤能餐汗多畏熱脈滑而數嘔渴苔黃惡露流通血分無病乃燥火伏於肺胃法宜清肅上焦不可謂産後禁涼潤也劑以沙參茹滑知斛冬甘枇杷葉冬瓜子葦莖梨皮桑葉蛤殼出入互用旬日而痊錢氏婦患嗽數月多醫莫治漸至廢寢忘餐凜寒乍熱經停形瘦心悸耳鳴滋補填陰轉兼便泄孟英視脈虛弦緩大而氣短懶言臥榻不支動即自汗曰固虛也然非滋陰藥所宜豫參耆龍牡桂苓甘芍冬蟲夏草飴糖大劑服旬日而安繼去龍牡加歸杞服二十劑汛至而康病者欲常服補藥孟英止之曰病痊體健何以藥為吾先慈嘗云人如欹器虛則欹中則正滿則覆世之過服補劑致招盈滿之災者比比焉可不鑑哉高魯川三令愛為外科姚仰余令郎杏村之室年三十五歲自去年仲夏患痢白少赤多晝夜一二十行或有溏糞相雜醫治日殆延至今冬經斷半年脅腹聚塊時時上竄宛如蟲行癢至於咽食壓始下腹脹腿腫唇白口糜舌絳無津耳鳴巔痛略有干嗆渴飲汗頻熱淚常流溺短而熱善嗔多夢暮熱無眠心似懸旌屢發昏暈痢門與蟲門方藥遍試無功舍病而補法備施亦無寸效僉云不能過冬至棺衾咸備無生望矣杏村之僚壻蔣禮園黃上水交薦孟英圖之脈至左弦數上溢尺中滑大按之細弱右手軟滑略兼弦數診畢謂杏村曰令正幸能安穀得以久延然下痢五百日喉齶辣燥陰液固已耗傷而尺膚淖澤脂膏未剝其中蓋別有故焉腹中之塊痢前曾有乎痢後始起乎杏村云起於痢前然則前此曾有産育乎云去年二月間分娩艱難胞已糜碎生而未育曰是矣此實似痢而非痢也夫胞衣糜碎必有收拾未盡而遺留於腹中者惡露雖行此物未去沾濡血氣結塊漸成阻礙衝任之常道而衝任二脈皆隸陽明月事既不能循度以時下遂另闢捷徑旁灌於陽明致赤白之物悉由穀道而出宛如痢疾據云姅期向在中旬故每月此時痢必加甚仍與月汛相符雖改途易轍而行尚是應去之血所以痢至年半尺膚猶不至枯瘁也且其痢由腰脊痠楚而下顯非腸胃之本病緣病起夏月正痢疾流行之候病者自云患痢醫者何暇他求通之澀之舉之填之無非腸胃之藥不但未切於病情抑且更廣其病機試思腸胃之痢必脂膏削盡而經枯則焉能納食如常而充肌膚耶然非謂不必治其痢也欲治痢必治其所以痢則當治衝任治衝任必治衝任之所以病則當去其遺留之物遺留之物去則衝任二脈遵道而行月事如期痢亦自愈第物留已將兩載既能上行求食諒已成形前醫指為蟲病而無面白唇紅之證據者蟲必飲食挾濕熱之氣所化此但為本身血氣所凝似是而非判分霄壤況此物早已脫蒂不過應去而未去欲出而不能開通衝任二脈其物自下不比腸覃石瘕有牢不可拔之勢必用毒藥以攻之者爰以烏鰂鮑魚茜根龜板鱉甲血餘車前子茺蔚子藕汁為初方衆見方案僉云舍垂危之痢而不顧乃遠推將及兩年之産後而指為未經人道之怪證不但迂遠穿鑿未免立異矜奇疑不敢從蔣禮園令弟敬堂云徐洄溪批葉案以十年九年之病仍標産後為大不然謂産後過百日而起病者不作産後看舉世皆以為定評余讀孟英所輯葉案瑕瑜謂案中所云十年九年者乃病從産後起延至於今而屢發也否則脹瀉浮腫何必遠推多載之前而隸於産後耶更有新産之後其病不因産育所致者雖在百日之內亦不可謂之産後病僅可云病於産後耳此證痢雖起於百日之外塊早形於兩月之前因流溯源正是治病必求其本也今人之病何必古書盡載此醫之所以不易為而辨證之所以為最難也聽其議論具有根柢並非捕風捉影之談況藥極平和又非毒劑似與久病元虛無礙他醫既皆束手盍從其計求生具囑仰余勿改其方於是群議始息服兩劑後病者忽覺糞從前陰而出大駴急視之乃血裹一物頭大尾小形如魚鰾而有口剖之甚韌血滿其中衆始詫為神治而病者汗暈不支孟英即與人參龍骨牡蠣茯苓麥冬甘草小麥紅棗為方服數劑神氣安爽始知臍下之塊已落而左脅下者猶存然上竄之勢向亦臍下為甚竄勢既減痢亦漸稀改用白頭翁湯加阿膠甘草小麥紅棗吞仲景烏梅丸和肝脾之相賊養營液而息風旬日後頭目漸清腫消脹減復以初方合金匱旋覆花湯服四劑又下一物較前差小而脅塊乃消竄癢悉罷痢亦徑止惟溺熱便溏口猶辣渴心搖易汗腿軟無眠煩躁火升脈形虛豁乃陰火內熾脾受木乘營液久傷浮陽不斂也授歸耆建中湯去薑加黃柏烏梅龍骨牡蠣小麥以羊肉湯煎送下交泰丸一錢脈證雖覺漸和惟久病元虛屢生枝節孟英堅持此法不過隨機略為進退而已而旁觀者議論紛紜因囑邀王篪伯會診篪伯亦主是法浮言乃息服至匝月喉間漸生甘液而各恙遞平又匝月甘液布及舌尖而滿口皆潤次年二月中旬經至肌充而愈適吳楚之警遂輟藥逮仲冬患瘡誤用藥水洗之致毒內陷而殞惜哉炳按交泰丸系黃連瑤桂心研末為丸施秋濤室仲冬分娩因前歲初産艱難穩婆妄施毒手臠而出之自懷憂懼産周時不下舉家皇皇穩婆以為奇貨可居力贊仍喚原手相助竟仍前例索謝而去孟英聞之惻然謂其乃尊趙菊齋曰難産自古有之莊公寤生見於左傳故先生如達不坼不副詩人以為異徵然先生難而後生易理之常也晚嫁者尤可必焉但亦有晚嫁而初産不難者非晚嫁而初産雖易繼産反難者或頻産皆易間有一次甚難者有一生所産皆易一生所産皆難者此或由稟賦之不齊或由人事之所召未可以一例論也諺云十個孩兒十樣生至哉言乎若得兒身順下縱稽時日不必驚惶安心靜俟可耳會稽施圃生茂才誕時其母産十三日而始下母子皆安世俗不知此理稍覺不易先自慌張凶惡穩婆故為恫嚇使人不敢不從其計要取重價操刃臠生索謝去後産母隨以告殞者有之奈貿貿者不知墮彼術中尚誇其手段之高忍心害理慘莫慘於此矣設果胎不能下自有因證調治諸法即胎死腹中亦有可下之藥自古方書未聞有臠割之刑加諸投生之嬰兒者惟有一種騾形女子交骨如環不能開坼名鎖子骨能受孕而不能産如懷妊必以娩難亡此乃異稟千萬人中不得其一二者如尋常可開之交骨斷無不能娩之理也菊齋聞而浩嘆産後患干嗆不飢少眠善夢口乾溺數繼發寒熱孟英診曰幸體氣堅實不過因驚懼而感冬溫耳與白薇梔子丹參竹茹茯苓青黛蛤殼枇杷葉豆豉蔥白投匕而安數日後寒熱又作仍投前方覆杯即愈繼去蔥豉加百合石斛知母服之各恙皆痊孟英又曰騾形為五不可孕之一方書誤作螺者非也蓋驢與馬交則生騾純牝無牡其交骨如環無端不能孕育體純陰性極馴而善走勝於驢馬然亦馬之屬也故易曰坤為馬行地無疆利牝馬之貞皆取象於此也人賦此形而不能安其貞則厄於娩矣秋濤聞之方疑其室之騾形也逮癸丑冬産一子竟無恙始悔前此為穩婆所愚也顧子襄體素豐患頤腫醫投升散之藥神昏氣逆鼻衄大流伊舅氏朱生甫明經為延孟英視之面赤音低不眠脘悶大渴溺赤脈滑數而洪曰冬溫也其苔色白而不燥者內有伏痰耳便瀉如水者肺熱下大腸耳豈可以為寒乎豫犀角元參旋覆梔芩射干竹茹通草銀花石菖蒲服之衄止神清瀉亦不作去犀射加花粉貝母服二劑解堅矢吐膠痰知飢熱退而愈繼有朱氏子右頸腫突外科圍藥甚痛身熱不飢孟英診曰冬溫耳非患癰也敷藥亟令洗淨另以芙蓉葉杵爛塗之投以清解肺衛藥數日而痊蔣氏婦年逾四旬患一奇證痰必自少腹突沖而上其勢甚猛其堅如石其熱如火故突然而沖之際周身為之震撼日夜二十餘次每次止須一咯即脫然出口四肢漸形牽掣口極渴而溺如沸湯食減少眠形日消瘦諸醫皆知為痰火病而治無寸效孟英視之曰證治非謬而藥不勝病者殆積熱深錮必從前多餌溫補所釀也其夫云誠然向來本無病因無生育紫河車已服過數十具他藥稱是曰愚哉藥之治病猶兵之戡亂也所謂用藥如用兵無病而藥是黷武也既無生育何不納妾凡服溫補之藥以求子者其藥毒鍾於小兒生子多不育況食人之胞乎無論忍心害理已屬不仁即偶然得子多患異疾或頑蠢狠戾而無人心亦何益哉昨聞沙沛生令妹患痘服此致鼻穿而痘仍不救設非胞衣之毒奚至此乎故余臨證三十年從不用之縱病家要用亦必剖陳利害以勸止之或令以羊腎代之溫養有情且無穢毒功較勝焉令正服過數十具而從未生育毒氣毫無出路欲種子者翻種病矣豈尋常清涼之劑所能愈哉考古惟紫雪能搜剔久蘊深藏之毒火試餌之或有驗也爰用紫草銀花元參土茯苓甘草緑豆海虴鳧茈為方和入竹瀝另以豆腐皮包吞紫雪五分服之果效匝月而瘳陸渭川令媳患感適遇姅期醫治數日經止而昏狂陡作改從熱入血室治轉為痙厥不省人事所親沈雨階為延孟英診之脈弦羍而虛滑氣逆面青牙關不開遺溺便祕令按胸次堅鞕如柈此冬溫尚在氣分如果熱入血室何至晝亦昏迷良由素多怫鬱氣滯痰凝用柴胡則肝氣愈升攻瘀血則誅伐無過豫小陷胸合蠲飲六神湯加竹瀝調服牛黃至寶丹一顆外以蘇合丸塗於心下痰即湧出胸次漸柔厥醒能言脈較有力次日仍用前方調萬氏清心丸一粒果下痰矢漸啜稀糜改授肅清數日而愈續有顧某陡患昏狂苔黃便祕臥則身挺汗出五心醫云熱入膻中宜透斑疹治之加劇孟英診脈弦緩不鼓身無大熱小溲清長的非外感乃心虛膽怯疑慮憂愁情志不怡郁痰堵竅也以蠲飲六神湯合雪羹加竹葉蓮子心竹瀝服二劑狂止自言腹脹而頭偏左痛仍以前方吞當歸龍薈丸大解始下改用清火養心化痰舒郁之法而愈孟英治其令弟季傑之簉室懷孕患嗽嗽則鼻衄如噴憎寒乍熱口渴頭疼右脈洪數授白虎湯合蔥豉投匕而瘳或云時已隆冬何以徑投白虎孟英曰脈證如是當用是劑況今年自夏徂冬亢旱不雨寒雖外束伏熱蘊隆此即麻杏甘膏之變法耳朱介眉年逾花甲患感於季冬初服溫散苔色遂黑即投白虎胸脅大疼面赤不眠口乾氣逆音低神憊溺赤便溏醫者僉云不治孟英切脈虛數而弦是真陰素虧痰多氣鬱今年自夏徂冬亢旱已極所伏之邪無非燥熱稍一溫散火即燎原一見黑苔即投白虎而不知其樞機窒滯氣道未舒且陰液耗傷亦非白虎湯僅能滌熱者之任也豫沙參葦莖竹茹冬瓜子絲瓜絡展氣開痰蓯蓉當歸紫石英冬蟲夏草潛陽鎮逆覆杯即減旬日而瘥石北涯之大令媳忽患多言不寐面赤火升汗出心搖倉皇欲死孟英察脈虛弦小數乃賦質陰虧將交春令虛陽浮動有鳶飛魚躍之虞亟以人參龍齒牡蠣石英甘草百合小麥竹葉紅棗青鹽水炒黃連為劑引以雞子黃投匕即安續加熟地阿膠滋填而愈蔣敬堂令正懷妊九月忽患胎上撞心面浮痰塞四肢搐搦神氣昏瞀亟延孟英視之豫紫蘇菖蒲半夏枳實茯苓橘皮羚羊鉤藤旋覆赭石為劑服後即舉一男母子皆安而愈同時聞幼科王蔚文令媳妊已臨月患證亦爾治不如法不産而亡乙巳秋拙荊年三十二歲忽患四肢痠痛早晚尤甚初謂其平素勞瘁所致已而日劇延醫治之以為痛風服藥不效單方針灸無不遍試至冬令漸難行走次年春山陰俞某作虛風治用參朮熟地桂附等藥文恐太熱減去附子服十餘帖遂手足拘攣不能屈伸日夜號痛如受炮烙眠食皆廢痰韌如石皮膚燥裂鱗起如松至夏更加兩腋腫核陰戶瘡糜痛不可支業師顧聽泉先生荊人之舅氏也求其援手云兩脈弦數舌絳無津況汛斷半年破䐃脫肉經言九侯雖調猶屬不治危殆若此不能過夏至矣因請孟英先生救之先生來視曰營分素虧陰液盡爍幸病在經絡猶可圖治第恐成廢耳授以西洋參元參生地天冬麥冬知母花粉銀花甘草葳蕤石斛絲瓜絡等藥出入為劑用竹瀝梨蔗諸汁和服酷暑之時則加生石膏西瓜汁文遵方恪服計燒瀝之竹四五十竿榨漿之蔗七八十枝搗汁之梨五六十斤絞汁之瓜三四十枚果痛漸以減瘡漸以平膚漸以蛻食漸以增仍溉以涼潤生津兼佐熟地枸杞歸身之類服至兩載月事乃行又半年肌肉漸充手足亦能舒展聞者無不驚異今則形神如昔步履雖未能如常已可坐轎出門是證也不遇先生必致夭枉既銘諸心復録之以為後人鑑錢塘張文輝月卿謹識病人久臥床蓐則腰臀磨穿內經謂之破䐃俗呼痎瘡是也最為難治孟英令人於初起時即用廣東羊皮金貼之甚效然此等佳案前未收輯今張君聞有三編之輯附録於此益信遺珠不少也弟王士華仲韶校字
