body:
  text: 卷一辛亥春孟英治其令正誕子三朝忽渾身麻冷尋即壯熱大渴汗出不解耳鳴眼淚舌絳無津苔色燥黃腹痛拒按不飢脘悶惡露仍行小溲極熱脈則弦滑右甚是胎前吸受風溫兼挾痰食內滯雖新產血去陰傷見證較劇然病不在營亟宜撤熱以安營不可破血以傷營亦不可養陰而助病遂以元參白薇梔子知母竹茹旋覆菖蒲枳實栝蔞為方服之熱雖退而脈不減仍用此方越二日復麻冷而後熱惟舌稍潤苔較薄耳再飲之熱亦即退並吐膠痰數碗略進稀糜間一日又發寒熱或疑為瘧或疑分娩不易用力勞傷恐是虛證苟不及早溫補蓐損堪虞孟英一一頷之復與前藥熱果漸短渴亦遞減逾日寒熱猶來亦不更方至十一朝始下黑燥矢而寒熱乃休即能安穀計服此藥已十大劑矣始出方與戚䣊閱之蓋恐眷屬之預聞涼解而有阻撓也諸親莫不駴詫然此證非孟英獨斷獨行斷難成功設泥新娩而通瘀或以為瘧而溫散或疑其虛而滋補勢必驟變即有瞻顧亦必邪熱糾纏而延成蓐損世人之病往往弄假成真者大率類此王瘦石令郎遲生年未冠而體甚弱夜夢中忽如魔如驚肢搖目眩雖多燃燈燭總言黑暗醒後納食如常月一二發乃父以為憂而商於孟英脈之弦細而澀曰真陰不足肝膽火炎所致耳令服神犀丹一月病遂不發繼予西洋參二地二冬三甲黃連阿膠甘草小麥紅棗熬膏服之竟刈其根逾年完姻癸丑已生子矣朱紺云令正去年娩後自乳而月事仍行至仲冬乳少汛愆咸以為妊也既而右脅筋絆作疼漸至肩背醫投平肝藥痛益甚改用補劑遂嗽痰帶血人皆以為損矣廣服溫補其病日增延至仲春臥榻已匝月群醫束手始求診於孟英面赤足冷時時出汗食減無眠脈來右寸溢關尺滑而微數左手弦而帶滑舌赤而潤微有白苔氣逆口渴所吐之血淡紅而夾痰涎大解溏小溲短且熱曰沖為血海而隸於陽明自乳而姅不爽期者血本有餘也因陽明經氣為痰所阻而不能流通輸布致經斷乳少痰血轇轕而為絡痹竄痛醫者不為分導下行病無出路以致逆而上溢再投補劑氣愈窒塞在山過顙夫豈水之性哉予葦莖湯加茜根海螵蛸旋覆滑石竹茹海䖳為劑和藕汁童溺服以肅肺通胃導氣化痰而領血下行覆杯即愈旬余汛至不勞培補尋即受孕此證不遇孟英必至補死而人亦但知其死於虛勞也服藥可不慎耶韓貢甫於去冬偶患足瘡瘍科治之瘡愈而大便下血漸至腰背疼脹醫謂其虛率投溫補病日以劇迨仲春寒熱時作臥榻不起諸醫束手已治木矣所親陳季竹囑延孟英圖之脈弦緩而澀苔黃溺赤飲食不思曰此藥病也良由氣機鬱滯濕熱不清補藥亂投病漸入血然猶自尋出路奈醫者不知因病而下血不治其病徒澀其血則氣機愈窒營衛不通寒熱不飢固其宜也而又疑為土敗陰虧脾腎兩補藥力愈峻病勢愈危若我視之原非大病肯服吾藥不日可瘳乃兄聰甫聞之大為折服以海䖳蘆菔湯煎蘆根厚朴絲瓜筋通草白薇梔子楝實竹茹等藥投之三劑而寒熱不作胃漸知飢旬余血止溺澄各恙皆已改服清養藥而康邵氏子於母殯發引之時忽仆倒不省人事亟請孟英視之灌蘇合香丸而蘇又屠氏女送父殯至厝所歸即神氣瞀亂如癲如瘋速孟英治之投以玉樞丹而瘳此即謂所飛屍之候也殳某久患寒熱精遺自汗能食神疲肌肉漸瘦詣孟英診之脈大微弦予黃耆建中加參歸龍牡而瘥夏初孟英挈眷送太夫人葬於䖚亭山越日歸其令郎心官患微熱音嗄夜啼搐於搦幼科謂其生未三月即感外邪又兼客忤復停乳食證極重也疏方甚龐雜孟英不以為然乃用蚱蟬三枚煎湯飲之蓋取其清熱息風開聲音而止夜啼一物而擅此數長與證適相對也果覆杯而愈趙笛樓聞而嘆曰用藥原不貴多而貴專精思巧妙抑何至於此極耶然即古之奇方也今人不能用而孟英每以此法奏神效錄此以見一斑錢希敏室坐草二日即未分娩忽患小便不通勢甚亟乃速孟英視之脈至滑數睛赤口乾以為熱結膀胱氣不化達予車前子滑石血餘栝蔞知母梔子牛膝紫菀紫草為大劑投之是通溺催生互用之法服後溲仍不行徑產一男既而胞下溺滿其中始知兒出胞後頻飲湯水盡貯其中也孟英曰此證古所未聞余雖初不料其如此然非開泄導下則兒不即娩吉凶未可知矣而折肱漫錄云孕婦將產如患小便不通乃脾氣虛弱不能勝胞故胞下墜壓塞膀胱使然宜重劑白朮大健其脾則胞舉而小便自通者正與此證虛實相對想其脈必有虛微之象也幼科王蔚文之甥女向依舅氏於三年前患熱病甚危服多劑涼解始愈第寢食雖如常人而五心恆熱黑苔不退口苦而渴畏食葷膻頻餌甘涼之藥經來色黑不紅去年適吳氏仍服涼藥迄不能痊今夏伊舅氏浼孟英診之脈甚滑數曰此熱毒逗留陽明之絡陷入衝脈以沖隸陽明也然久蘊深沉尚不為大患者以月事時下猶有宣泄之路也其頻年藥餌寒之不寒者以熱藏隧絡湯劑不能搜剔也令每日以豆腐皮包紫雪五分吞下半月後苔果退渴漸減改用元參丹參白薇黃芩青蒿煎湯送服當歸龍薈丸又半月經行色正各恙皆蠲尋即受孕焉朱生甫明經令郎仲和於六月初旬患瘧寒少熱多嘔渴痞悶逆孟英視之曰曩曾屢患此疾證形大略相同廣延名手治療總難即愈病輒經年大受其累聞君療瘧極神不知能否於月內即痊孟英曰何限之寬耶余非神於此蓋寒暑燥濕風五氣之感於人也重則為傷寒輕則為瘧疾今所患者暑濕之瘧也清其暑濕旬日可瘥前此之纏綿歲月而不能已者必是不分五氣之源流徒以見瘧治瘧而用柴胡薑棗等風瘧之方以致暑濕之邪滋蔓難圖耳茲以清暑化濕湯奉贈放膽服之不可商於人恐其於五種傷寒未能辨晰而泥少陽正瘧之法以相爭也仲和韙之方用石膏杏仁半夏厚朴知母竹葉果八劑而安既而梁甫之仲郎亦患瘧孟英視曰脈數舌絳熱熾寒微素質陰虧暑邪為患也更不可稍用瘧門套藥予元參青蒿白薇丹皮黃菊知母花粉銀花竹葉梔子數帖而病減乃去青蒿丹皮加生地甘草數服而瘳石北涯之大令媳患瘧壯熱如焚背微惡冷汗多大渴舌絳神煩不食不眠奄奄一息亟迓孟英診之脈細數而芤知其陰分久虧暑邪深入遂予白虎湯去米加西洋參元參犀角竹葉銀花石斛為方六劑而愈人皆聞而異之孟英曰見病治病耳何異之有然與見瘧治瘧而不治其所以瘧者固有異焉韓正甫患瘧越醫王某進以柴桂薑樸等藥勢乃劇所親何新之知為藥誤改用清解而不效始乞診於孟英脈數而右更滑大搏指胸悶不堪溲赤而渴苔極垢膩以涼膈散去芒硝甘草合雪羹加厚朴杏仁石膏半夏石菖蒲投四帖頻下宿垢各恙皆減改投輕清以滌餘邪遂以向愈其時渠兄貢甫之室患瘧初起肢麻且冷口渴苔黃眩瞀善嘔心煩無寐孟英診曰此亦暑濕為瘧不可溫散者而越醫勸服朮樸薑椒等藥病家聞用溫化恪信弗疑二劑後嘔渴愈甚經不當期而至四肢終日不溫汗頻出而熱不休再邀孟英診之脈漸伏曰此熱深厥深之謂也溫燥熱補切弗再服病家不信另招張某黃某會診僉云陰暑宜舍時從證徑用薑附六君加萸桂沉香等藥服之肢愈冷藥愈重八劑後血脫如崩而逝即以春間為貢甫所治之棺殮焉豈非數已早定耶故雖一家之中同時之病而疑信不同死生判別況春間貢甫之病治有成效尚蹈此轍無怪乎求未經目擊溫熱之害者宜其以服涼解藥為可恥矣吾師趙菊齋先生令郎廉士之如君新娩後微寒壯熱小溲全無惡露稍行大便如痢神煩善哭大渴不眠專科謂瘧痢交作不能圖治遂請孟英援手脈來洪大滑數曰暑為患耳不必治其瘧痢以辰砂益元散加竹葉銀花丹皮木通元參丹參蓮杆為大劑投之三帖各恙皆平第營陰素虧即改甘涼濡養善後而愈尚且乳汁全無顯由血少設非清解又當何如耶繼有表弟潘少梅喬梓同時患暑濕瘧孟英咸與清化法數劑皆愈潘反生疑謂病邪被涼遏伏故瘧遽止恐將來必有他患孟英喟然曰甚矣醫之不可為也世人患瘧苦無良治纏綿不愈習見不疑余之治瘧則不然但專力治其所以病故瘧疾雖與傷寒同有五種之別而受病究比傷寒為輕苟治之如法無有不數劑而愈者設誤藥以遏其邪之出路則苔不能化溲不能澄神不能清食不能進矣子自思之其真愈乎抑假愈乎潘始恍然大悟而首肯焉蔡西齋令正腹有聚氣時欲攻衝醫者以為下部虛寒進以溫補攝納如桂附沉香蘆巴故紙吳萸之類愈服愈劇酷暑之時其發益橫日厥數十次醫皆望而卻走乃迎孟英視之脈數舌絳面赤睛紅溺如沸湯渴同奔驥少腹拒按飢不能餐曰事急矣緩劑恐無速效令以豆腐皮包紫雪一錢另用海䖳鳧茈煎濃湯俟冷吞下取其芳香清散之性直達病所也服後腹如雷鳴渾身大汗小溲如注宛似嬰兒墜地腹中為之一空其病已如失矣繼有許梅生八令愛患痛厥屢日筋掣神迷肢冷息微脈伏唇紫多藥無效孟英亦以此藥灌之而蘇新秋汪子與室寡居患瘧範某疊進小柴胡法昏熱欲厥腹痛汗淋人皆危之乃祖朱椿年太史逆孟英往視兩尺空數左關弦寸溢右寸關滑駛曰此真陰素虧腹有聚氣吸受暑熱最忌升提與元參西洋參百合竹葉蓮子心鱉甲牡蠣楝實小麥黃連等藥兩劑而減其族人謂瘧禁涼劑而尺脈無根苟非溫補猝變可虞母家不從兩疑莫決因請乩方服之數日後勢復劇苔漸黑伊父朱次膺仍乞援於孟英及診脈更數於前因於前法中加犀角兩帖而安續以滋潛善其後而愈湯振甫患瘧於嘉興醫知為暑與清解法轉為泄瀉以為暑去而濕存改用溫燥瀉益甚而發熱不休神氣昏瞀因而束手令其買棹旋杭所親陳雪舫延孟英視之苔黑麵紅胸間拒按便如膠漆小溲全無譫妄耳聾不眠善笑脈則洪數而芤予黃連黃柏黃芩銀花石斛梔子楝實知母蔞仁元參為方綠豆煎清湯煮藥調下神犀丹四劑而胸次漸舒稍啜稀粥便色漸正小溲亦通乃去神犀楝柏加生地石膏服三日熱淨神清脈來柔緩以甘涼養液十餘劑而瘳大凡溫熱暑證而大解溏泄者正是熱邪下行豈可誤投溫燥之藥反助燎原之勢哉同時一男子患感瀕危浼孟英勘之神昏舌黑瘛瘲脈微曰遲矣此犀角地黃證惜無人用病家云陸某已屢用之矣因索其方閱之雖用犀角屑八分生地五錢緣病者便溏配以枳殼炒焦白朮三錢孟英喟然曰此方從無如此加減法況清涼不敵溫燥是徒有犀角地黃之名耳古人治病必放出路茲反截其去路良由學無理路遂致人無生路良可哀也眉批近日庸手每多患此全不揣摹古人處方之義複方之法矛盾混施深堪痛惡又犀角與枳朮合方可謂善做截搭題一笑炳章志朱次膺令正姅後偶有微寒微熱醫與解散藥一劑遂神疲自汗不食不眠泛泛欲嘔時時欲暈肢麻且軟氣欲上衝舌赤微苔溺頻脘痛便溏不暢目不欲張心悸懶言欲噫不達孟英察其脈虛弦軟數曰此營陰素虧憂愁勞瘁之餘血從下奪八脈交虛正所謂陽維為病苦寒熱陰維為病苦心痛也豈可以有寒熱而即從瘧治哉授以龜板鹿角霜當歸枸杞白薇紫石英甘草大棗小麥牡蠣數劑而安嗣與熟地棗仁當歸杞子麥冬楝實苡仁黃連壯水和肝而愈陳嫗年已七旬患霍亂轉筋甚危亟拉孟英救之已目陷形消肢冷音颯脈伏無溺口渴汗多腹痛苔黃自欲投井令取西瓜汁先與恣飲方用白虎加芩連黃柏木瓜威靈仙略佐細辛分許為劑覆杯即安人皆疑用藥太涼何以徑效孟英曰凡夏熱亢旱之年入秋多有此病豈非伏暑使然況見證如是之熾烈乎今秋余已治愈多人詢其病前有無影響或曰五心煩熱者數日矣或曰別無所苦惟睹物皆紅如火已而病即陡發夫端倪如此更為伏暑之的據焉李華甫繼室陡患霍亂而兼溺血如注頭疼如劈自汗息微勢極危殆迎孟英診視脈極弦駛是肝陽內熾暑熱外侵先用犀角木通滑石梔子竹茹薏苡銀花茅根菊葉為大劑和入藕汁送當歸龍薈丸而霍亂即安惟溺血雖減而小溲時頭猶大痛必使人緊抱其頭重撳其巔始可略耐尚是風陽僭極肺胃不清也以葦莖湯去桃仁加百合白薇元參竹葉西瓜翠衣菊葉蓮子心為方和入童溺仍吞龍薈丸服旬日而愈繼有祝氏婦患溺血五六年矣醫皆作淋治孟英診視脈弦數苔黃口苦頭疼溺熱曰是溺血也法宜清肝與久淋當滋補者迥殊病者極為首肯蓋其出路自知而赧於細述故醫者但知其為淋也陳楚珍仲媳陡患霍亂亟迓孟英治之云昨晚曾食冷魚夜深病作想由寒重致此然臍間貼以回陽膏而不效奈何及診脈右甚滑數口渴苔黃令按胸下果堅硬而痛曰吐瀉雖多宿食戀膈非寒證也回陽膏亟為揭去以石菖蒲枳實蘇葉黃連半夏竹茹海䖳蘆菔為方服之一劑霍然同門相簡哉室患瘧始則消散繼則補中益氣治之匝月萎靡不堪腹中似有聚氣時欲上衝氣促心搖汗多眩暈左脅震躍渴飲無眠骨瘦如豺醫皆束手吾師趙菊齋先生拉孟英往診脈弦細以數按之不鼓因謂相曰不可再以瘧字橫於胸中則旬日可安若見其久瘧而欲截之且聞前醫謂令正初次患瘧為胎瘧務令發透不妨形瘦似鶴此皆非余之所知也夫一生不患瘧者有之矣未聞先在胞中患過瘧疾而後生者也若以初次患瘧為胎瘧則他病之初患者無不可以胎字冠之矣何以不聞有胎痢胎傷寒之名乎因醫者治瘧而不知治其所以瘧以致纏綿難愈者多遂妄立胎瘧鬼瘧等名以紿世俗而自文其淺陋今昔相沿賢者不免故世人又有瘧疾不可服官料藥之戒其實藥亦何嘗有官私之別耶服藥不當皆能增病不服藥為中醫不僅為瘧疾而言也令正素稟陰虧感邪不重過投消散營液重虛再升其陽本實欲撥補中益氣原是成方與證不宜於體不合即為毒藥我儀圖之介類潛陽重鎮理怯甘酸化液厚味滋陰大劑而投膚功可奏相極感服如法服之果未浹旬霍然病已方以西洋參熟地牡蠣紫石英龜板鱉甲枸杞當歸冬蟲夏草龍齒阿膠麥冬龍眼甘草蒲桃干紅棗蓮子心小麥等出入互用也王雨蒼室仲秋患滯下治兩旬而罔效何新之薦孟英往視脈來弦數而滑腹墜腰疼溲少口乾面紅煩躁知飢能食夜不成眠而滯下赤白從無糞色相兼及至更衣又極艱澀略無痢色相雜通補溫涼服皆不應稍投升舉氣塞於胸詢其月事因痢愆期孟英曰此病不在腸中也能食便堅府氣並不窒滯陰虛木旺營液因而旁溢緣衝任隸於陽明平人氣血循經各行其度豈有衝任之血液可從大腸而出之理乎然天地雖有定位山澤可以通氣周身脈絡原自貫穿挹彼注茲風陽所煽猶之交腸證糞從前陰而出舉一反三病機可悟何極歎服爰以烏鰂茜根阿膠鮑魚蓯蓉枸杞柏子仁黃柏銀花藕為劑一服即減不旬而瘥續參熟地當歸龜板鹿霜善後而愈鮑魚淡乾魚也諸魚皆可為之然以石首魚為勝俗謂白鯗是也惟台州三伏時所幹者味淡而香色白尾圓世稱松門臺鯗可以入藥無腥咸作吐之弊其誤用蝮魚者蓋失考也洪張伯孝廉令弟蘇仲鄉試後自以場作不愜於懷怏怏數日漸以發熱醫作伏暑治日形困頓懶語音低神情恍惚稍閤眼輒以文有疵累如何中式云云屢服牛黃犀角等藥竟無寸效延孟英視之時時出汗不飢溺少舌絳口乾切脈虛軟以數曰此心火外浮也昔賢惟王損庵論之獨詳今人罕讀其書每與溫暑逆傳證混淆施治夫心猶鏡也彼熱邪內陷襲入心包則霧障塵蒙之象也故可磨之使明是為實證今心陽過擾火動神浮乃銅質將熔之候也法宜堅之使凝是為虛證良由陰分素虧心營易耗功名念切慮落孫山病屬內傷似乎外感大忌發表更禁寒涼又非東垣補中益氣之例無怪醫者為之技窘也而有藥治病無藥移情余有一言可廣其意文之不自愜於懷者安知不中試官之意乎且禍盈福謙易之道也嘗見自命不凡者偏不易售而自視欿然之士恆於意外得之即此一端吾可必其中也病者聞之極為怡曠服藥後各恙漸安半月而愈及榜發果獲售僉云藥即神妙而慧吐齒牙竟成吉懺仁言仁術醫道通仙可於孟英信之矣其方則甘草乾地黃麥冬紅棗枸杞鹽水炒黃連紫石英龜板龍齒珍珠也迨季冬兩孝廉將北上其母夫人陡病恍惚孟英往診曰高年素多憂慮而別離在即神倏飛揚縱有仙丹亦難救藥另邀他醫視之皆云冬溫須過十四日及旬而沒神氣不昏始信孟英鏡質消熔與塵濛霧障有殊也一嫗患面目肢體浮腫便溏腹脹腸鳴時痛飲食日減醫與理中腎氣多劑病日劇而束手矣始丐孟英診焉按脈弦細沉之帶數舌絳口乾腫處赤痛溺少而熱乃陰虛肝熱鬱火無從宣泄而成此病火愈鬱則氣愈脹氣愈脹則津愈枯再服溫燥如火益熱矣授白頭翁湯加楝實銀花元參丹皮綠豆皮梔子冬瓜皮數劑證減知飢漸佐養血充津之品而愈前此諸醫謂其山居久受濕蒸且病起黴雨之時而又便溏脈細遂不察其兼證而群指為寒濕也嗣有黃梅溪令堂患證類此而燥熱之藥服之更多肌削津枯脈無胃氣邀孟英往勘不遑救藥矣石北涯仲媳胎前患瀉季秋娩後瀉如漏水不分遍數惡露不行專科束手咸慮其脫亟孟英脈之左弦而數右大不空口苦不飢苔黃無溺曰非虛證也參湯斷弗沾唇予白頭翁合石頑伏龍肝湯丸治之一劑知三劑愈孫位申陡患喉偏左痛下及乳旁神疲欲臥動即凜寒速孟英視之脈弦細以軟苔薄白口不渴痰多且韌溺赤不飢是暑濕內伏而肝鬱不舒且陰兮素虧復傷勞倦也昔人之清暑益氣湯藿香正氣丸皆是成法設誤投之悉為戈戟幸病家深信不疑旁無掣肘予射干兜鈴蔞殼通草滑石竹茹絲瓜絡冬瓜子枇杷葉荷杆極輕清之藥一劑即吐膠痰數碗汗出周身喉痛較松凜寒亦罷而身痛微熱苔色轉黃去射干兜鈴加梔子豆卷服之熱退痛減再去滑石豆卷加石斛沙參野薔薇露投之知飢啜粥諸恙悉安嗣用養陰充液而愈施玉林患感治經多手延將匝月熱退未淨苔膩垢黃脘悶便溏腰痛溺短不飢不眠氣短音低醫者技窮李華甫薦孟英視之脈弦軟不調而尺中虛細是痰熱尚結於上焦房勞素傷於下部初治即從清解並無背謬之方奈不足以開有形之結而滋久耗之陰以致曠日相持神氣日形消索也以小陷胸湯加葦莖竹茹枇把葉蘭葉石斛歸身枸杞為方加野薔薇露和服一劑苔即化三服而結糞下胸乃舒去蔞仁加西洋參服四帖苔淨能餐諸恙冰釋續投峻補肝腎而康儒醫何新之素患脘痛每日必吐水數缶始舒暢吐後啖麵食肉如湯沃雪第不能吃飯者十餘年矣季秋痛吐益甚飲食不進平肝通絡諸治不瘳人極委頓屈孟英視之脈弦滑而軟曰中虛停飲也以六君去甘草加桂枝厚朴牽牛服之積飲果下痛亦漸休吐止餐加精神稍振乃去牽樸加附子白芍薏仁與之遂愈且能吃飯病者謂既能吃飯善後藥不肯多服迨仲冬中旬出門診疾驟與嚴寒歸即痛作連服荔香散數日而逝蓋中氣素虛者不可專用香散之藥也許蘭嶼令正自夏間半產後患感證雖已治愈而腰腹左痛時作多醫雜治其痛日增食減汛愆臥床不起黃某謂諸藥無功惟有腎氣湯先固其根本頻服之痛益劇且痛作之時則帶下如注黃謂顯系真火無權附桂復為加重遂至痛無停晷呻吟欲絕陳春湖囑迎孟英診之左關尺弦數無倫形消舌赤徹夜無眠是腎陰大虧肝陽極熾營液耗奪八脈交虛之證也用龜板烏鰂蓯蓉枸杞歸身楝實竹茹白薇黃柏絲瓜絡蒲桃干藕為方一劑知數劑已續加熟地阿膠調理月餘經行而愈陳笠塘年近花甲於初冬時偶從梯半一跌遂發寒熱痰多咳逆沈辛甫作虛痰類中挾風溫治熱退便行而痰逆不休且兼呃忒改從清肅鎮攝其呃日甚因拉孟英商之診脈左弦澀不調右兼軟滑察其呃時有微甚而有欲呃不爽之象詢其噴嚏久不作矣曰此氣鬱於肝欲升而不能升痰阻於肺欲降而不能降之證也補攝之品咸在禁例以柴胡枳殼石菖蒲紫蘇薤白蔞仁竹茹橘皮白前為劑覆杯而減再劑而安翁笠漁素健啖偶患發熱錢某謂勞倦內傷進補中益氣法病日劇張某診為停食感冒用承氣法下之連解黑矢熱如故與養陰藥多劑熱仍不退且從此不食不便不渴不眠僉云攻補難施已成壞證所親孫詒堂迓孟英診之脈形澀數不調神呆靜臥倦於語言溺少苔黃時時面赤曰無慮也衛分之邪失於清解補中益氣實衛錮邪何異適燕而南其指乎承氣通府但能下其腸胃有形之物不能散其衛分無形之邪下後養陰固是方法然必表裡皆和者方可投之衛氣未清徒增窒滯樞機日鈍此神識之所以如呆也升降失司此出入之所以皆廢也延之雖久病猶在衛故可治也予葦莖蔥豉加芩桔梔子栝蔞服一劑而遍身赤疹神氣爽悟乃去芩桔蔥加雪羹蘆菔銀花蘭葉服數帖解醬矢二十餘次苔退知飢脈和而愈咸豐紀元冬十月荊人忽患頭痛偏左為甚醫治日劇延半月痛及頸項頰車始艱於步繼艱於食馴致舌強語蹇目閉神蒙呼之弗應日夜沉踵如木偶焉醫者察其舌黑灌犀角牛黃紫雪之類並無小效扶乩求仙藥亦類是乃兄周雨禾云此證非孟英先生不能救吾當睡其門而求之及先生來視曰苔雖黑而邊猶白潤唇雖焦而齒色尚津非熱證也投藥如匙開鎖數日霍然緣識數語並錄方案如下用表再生之大德而垂為後學之津梁云仁和蔣寅謹識真陰素虧兩番半產兼以勞瘁內風陡升病起頭疼左偏筋掣旬日不語二便不行不食唇焦苔黑邊白胸腹柔軟神氣不昏脈至弦緩並不洪數此非熱邪內陷乃陰虛痰滯機緘宜予清宣勿投寒膩轉其關鍵可許漸瘳十月二十五日初診石菖蒲麩炒枳實仙製半夏鹽水泡橘紅各一錢鮮竹茹四錢旋覆花茯苓當歸各三錢陳膽星八分鉤藤五錢後下竹瀝一杯生薑汁三小匙和服蘇合香丸塗於心下以舒氣鬱舌稍出齒未能全伸苔稍轉黃小溲較暢羞明頭痛顯屬風升咽膈不舒痰凝氣阻本虛標實脈軟且弦不可峻攻法先開泄二十六日再診前方去膽星半夏茯苓加枸杞三錢淡蓯蓉一錢蔞仁五錢舌能出齒小溲漸行神識稍清苔猶灰滯頭疼似減語未出聲脈至虛弦右兼微弱本虛標實難授峻攻開養兼參庶無他變二十七日三診前方去枳實旋覆鉤藤竹瀝薑汁加參鬚一錢麥冬三錢遠志七分老蟬一對淡海䖳一兩鳧茈三個稍能出語尚未有聲舌色淡紅苔猶灰膩毫不作渴非熱可知脈軟以遲不食不便宜參溫煦以豁凝痰二十八日四診前方去雪羹加酒炒黃連肉桂心各五分苔漸化而舌漸出語稍吐而尚無音頭痛未蠲略思粥食胃氣漸動肝火未平久不更衣脈仍弦軟徐為疏瀹法主溫通二十九日五診前方去麥冬加麻仁四錢野薔薇露二兩和服連投溫養神氣漸清語亦有聲頭猶左痛苔退未淨大解不行左脈微遲法當補血血充風息府氣自行十一月初一日六診前方去遠志菖蒲老蟬加天麻一錢白芍二錢桑椹三錢脈已漸起尚未更衣濁未下行語猶錯亂時或頭痛寐則夢多濡導下行且為先授初二日七診前方去天麻桑椹加牛膝三錢生首烏四錢柏子仁二錢雖已知飢未得大解肝無宣泄時欲上衝陰分久虧豈容妄下素傷思慮肝鬱神虛脈軟而遲語言錯亂法當養正通鎮相參初三日八診前方去白芍首烏加紫石英四錢砂仁末炒熟地六錢遠志七分菖蒲五分大解已行並不黑燥肝猶未戢乘胃脘疼幸已加餐可從鎮息初四日九診參鬚仙半夏各一錢砂仁末炒熟地八錢牡蠣六錢紫石英四錢歸身三錢枸杞二錢淡蓯蓉一錢五分川楝肉一錢酒炒黃連三分桂心五分研調三帖復得大解苔退餐加肝血久虧筋無所養頭疼脘痛掣悸不安柔養滋潛內風自息初七日十診前方去半夏連楝加炙草橘餅各一錢烏梅肉八分四帖神氣漸振安穀耳鳴脈弱口乾面無華色積虛未復平補是投十一日十一診前方去桂心橘餅烏梅加龜板六錢麥冬蒲桃干各三錢十帖後汛至體康而愈矣許自堂叔岳年越古稀忽頭面赤腫磊癢漸及兩臂煩燥不眠飲食日減外科治而勿效孟英脈之弦洪疾駛重按細軟曰高年氣血兩虧鬱火內燔不可從瘍科治予黃耆當歸梔芍元參生地甘草桑葉菊花丹皮蒺藜荊芥等出入為方十餘劑而瘳顧仙槎年越古稀仲冬偶患痰嗽服表散藥數帖氣喘如奔欲臥而不能著枕欲食而不能吸納痰欲出而氣不能吐便欲行而氣不能送日夜危坐躁汗時形其婿家請孟英視之按脈虛洪豁大而舌色干絳溲赤點滴證屬陰虧忌投剛燥與西洋參熟地蓯蓉枸杞蔞仁麥冬牛膝茯苓白芍冬蟲夏草青鉛為大劑以豬肉煮清湯煎服果韌痰漸活堅矢下行眠食亦安遞以告愈傷風雖小恙過表傷陰與邪未淨而早投補劑皆能延損其高年下虛而誤服升提者往往陽浮上戴須以溫補救之更有一種似傷風而實非傷風之證乃根蒂空虛腎水泛溢以成痰浮陽沖逆而為嗽也此自古未經道及者今年四月十二日孟英詣高石泉處謝吊偶診其脈左關尺忽見浮弦而空因私囑其次郎雋生曰尊翁之脈頗有可慮子其慎之繼無所苦方疑其言之未當雖有小恙亦未邀診迨雋生登賢書計偕有日石泉忽患痰嗽酷似傷風馮某視之與解散藥一帖次日便瀉數行黃某進分清藥一劑第三日痰升氣逆自覺唇腫不能啜飲雋生始憶及孟英之言速其拯治脈如蛛絲過指舌色晦黯無津唇不略腫其不能吸飲者蓋由氣有出而無入耳陰既脫於下陽將脫於上莫可救藥翼日云亡此十二月春前事也聞霜降後許吉齋山長微患傷風數日而逝立春後許硯鄰亦然皆同為似傷風證也據孟英曰兒子阿心長成太速心性太靈余固知其不秀秋分後小患傷風適余酬應紛繁不遑顧視且聞無甚大病亦不延兒科診視不料三日後倏然而殤或云惜不早治余謂襁褓而患根蒂之病雖治愈亦何益哉然則不必高年慮有此證即小兒亦間有之矣醫者其可以傷風而概視為小恙哉不居集專論傷風誤補成勞猶是一隅之見焉孫書三仲郎菊如之室因兒女過多不欲生產懷妊屢服下胎藥不應娩後三朝陡發寒熱兼以痛瀉所下皆黑而小溲不行醫作瘀治用回生丹等藥已覺漸愈惟寒熱間作不休至八朝或囑其邀孟英診視神氣頗安靜苔色黃膩不厚胃略知飢惟右寸關空大有靜中一躍之形診畢適前醫至孟英謂右脈不佳恐有驟變彼按脈云較昨已大和矣必無害也孟英唯唯而退菊如送至門外復囑以令正元氣大傷莫投峻藥而別繼聞是夜寒熱復作腹仍大痛更服回生丹越日而亡書賈陳南橋患冬溫數日後譫語不眠所親任殿華竭力清解熱退便行忽然不語因迓孟英視之入房見其危坐於榻面無病容兩目開闔自如呼之不聞不答若無知識者按脈左寸細數無倫尺中微細如絲乃腎陰素傷心陽過擾真水下竭真火將灺縱有神丹不能接續吾師趙菊齋先生暨許少卿皆在座僉云渠有八旬老父一歲孤兒盍忍契然勉為設法如犀角紫雪之類以圖萬一不亦可乎孟英曰此非痰滯於絡亦非熱傳手少陰適從高孫兩家來並此為三敗證餘一日而遇之皆無藥可用不敢立方平素不畏大證君輩共知稍有可為毋勞諄囑也既而果逝李健伯夫人因傷情志而患心跳服藥數月大解漸溏氣逆不眠面紅易汗臥榻不起勢已瀕危其次婿余朗齋浼孟英診之堅辭不治其長婿瞿彝齋力懇設法且云婦翁遊楚須春節旋里縱使不治亦須妙藥稽延時日孟英曰是則可也立案云此本郁痰證緣謀慮傷肝營陰久耗風陽獨熾爍液成痰痰因火動跳躍如舂若心為君主之官苟一跳動即無生理焉能淹纏至此乎但郁痰之病人多不識廣服溫補陰液將枯脈至右寸關雖滑而別部虛弦軟數指下無情養液開痰不過暫作緩兵之計一交春令更將何物以奉其生莫謂贈言之不詳姑順人情而予藥方用西洋參貝母竹茹麥冬茯神丹參蓯蓉薏苡紫石英蛤殼等服之痰果漸吐火降汗收納穀能眠胸次舒適而舌色光絳津液毫無改授集靈膏法扶至健伯歸因謂其兩婿曰我輩之心盡矣春節後終虞痙厥之變也已而果然朱仲和令正向於娩後陡患痙厥多醫以圖廣服補劑其人雖起厥疾弗瘳再產亦然延已數載安之若素孟英聞之嘗謂仲和曰將來受孕宜預藥以痊之今冬懷妊病發益頻遂邀過診脈甚弦滑厥前必先作脹更衣得瀉始舒巔頂時疼飲食不減曰肝風挾痰為患耳仲和云肝風則良是痰則從來未吐曰惟其不吐所以為患沈堯封謂胎前病痰證居半產時痰涎不下諸病叢生醫者未知此理徒知產後為虛痰處絡中如何自吐亦幸而痰在絡中補之不為大害不過錮之愈深耳豈可以不見痰面遂云無痰乎爰授蠲飲六神湯合雪羹加蔞仁竹瀝服三十劑病果漸愈次年娩後安然知病根已拔矣
