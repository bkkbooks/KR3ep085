body:
  text: 卷三癸丑孟春陳舜廷自寧波旋杭迓孟英診視云去冬患痰嗽彼處醫家初以疏散繼則建中諸藥備嘗日漸羸困左脅躍躍跳動胸次癢如蟲行舌素無苔食不甘味嗽甚則汗夜不安眠痰色清稀便溏溲短恐成肺痿惟君圖之孟英診曰病始肺傷於燥治節不行體質素屬陰虧風陽內煽爍其津液故右脈軟滑而虛溫以辛甘致左脈浮弦且數雖非肺痿而上下交虛治先保液息風續宜壯水可奏膚功徒化痰理嗽見病治病有何益乎爰以沙參葦莖冬瓜子絲瓜茹竹茹肅肺氣甘草石斛燕窩生津液冬蟲夏草石英牡蠣息風陽投劑即嗽減能眠旬日後去冬子石斛加歸身麥冬茯苓服數帖兩脈較和餐加溺暢再去牡蠣甘草絲瓜絡加熟地鹽橘紅十餘劑各恙皆安以高麗參易沙參善後而康馬翠庭鹺尹令寵患兩腿疼腫便溏不渴醫進蒼朮木瓜萆薢獨活等藥其病日甚不食不眠筋掣欲厥孟英切其脈弦滑而數詢其溺極熱如沸曰非寒濕也肝火為患耳便瀉是土受木乘不渴乃內有伏痰予梔柏芩蓮茹楝通草半夏蠶砂絲瓜絡為方一劑知二劑已許康侯令堂初夏患坐臥不安飢不能食食則滯膈欲噫不宣善恐畏煩少眠形瘦便艱溲短多藥莫瘳孟英按脈弦細而滑乃七情怫鬱五火爍痰誤認為虛妄投補藥氣機窒塞升降失常面赤痰黃宜先清展方用旋覆菖蒲紫菀白前竹茹茯苓黃連半夏枇杷葉蘭葉不旬而眠食皆安為去前四味加沙參歸身紫石英麥冬調養而痊康爾九令正患汛愆而致左脅疼脹口苦吞酸不飢不寐溲熱便難時時欲哭乃尊馬翠庭鹺尹延孟英診之左甚弦數以雪羹湯吞龍薈丸經行如墨而瘳繼因思鄉念切久斷家書心若懸旌似無把握火升面赤汗出肢涼乃父皇皇亟邀孟英視之左寸關弦數尺中如無乃陰虛木火上亢也以元參黃連牡蠣麥冬生地甘草女貞旱蓮百合石英小麥紅棗為劑引以青鹽一分覆杯而愈錢某患感醫治旬日漸致神昏瘛瘲大便泄瀉以其體素弱而吸洋菸也胥束手矣始丐診於孟英左脈弦軟右則虛大而滑汗出不解目瞀耳聾囈語溲紅時時呃逆心下拒按舌不能伸斡齒視苔滿黃微燥曰溫邪雖陷氣分未清裡氣雖虛伏痰內盛幸瀉數次邪勢稍衰先予人參牡蠣犀角元參竹葉竹茹銀花石斛枇杷葉川貝母蓮子心為劑調服萬氏清心丸一顆目明熱退呃減舌伸臂顯赤斑夜亦能寐詰朝去參蠣牛黃丸加竹瀝桑枝絲瓜絡痰果大吐瘛瘲即平再去犀元桑枝加紫菀海䖳呃止胸舒苔色漸退稀糜漸進耳聽略聰再去竹葉蓮心紫菀加沙參花粉服五帖而下堅矢嗣投調養而安李華甫年六十三歲仲夏患惡寒氣逆不飢即請孟英視之脈甚虛軟舌本紫而滑澤無苔溲頻數而濃赤不禁陰莖已縮兩手紫黯乃心陽過擾熱伏厥陰之象不可謂無熱惡寒發於陰而認為真傷寒也雖平昔耽飲嗜茶設投燥劑則液之涸也不須旋踵爰以蔥豉茹芩梔薇桑葉通草輕解其外至夜始發熱再劑微汗而解獨腹熱如烙舌漸干而口渴改予西洋參元參生地麥冬甘草花粉梔楝蓯茹和青蔗汁服二帖下堅矢而舌愈干且讝語不寐於前方加竹葉木通服之舌根始見黃苔知伏熱漸化再一劑苔轉黑原方調以神犀丹一丸即戰解而舌始潤稍啜稀糜猶妄言無寐乃心陰久耗陽不能收也仍以前方加童溲和服兩帖大解復行神氣漸謐諸恙尋愈此證設犯溫升即難救藥幸初發得遇名手始克扶危持顛旬日而愈故為相者治天下當因民之所利而利之不必務虛名而復井田肉刑也為醫者治人亦當因病之所利而利之不可守成法而泥麻黃桂枝也王炳華之媳屢次墮胎人漸尪羸月事亂行其色甚淡醫謂虛也大投補劑其瘦日甚食少帶多遂加桂附五心如烙面浮咳逆痰壅礙眠大渴善嗔醫皆束手始請孟英脈之兩尺虛軟左寸關弦數右兼浮滑乃陰虛火炎也然下焦之陰雖虛而痰火實於上焦古人治內傷於虛處求實治外感於實處求虛乃用藥之矩矱也爰以沙參竹茹冬瓜子蘆筍枇杷葉冬蟲夏草石英紫菀蓯蓉旋覆為方兩劑即能寐五六劑嗽止餐加乃去紫菀旋覆沙參加西洋參歸身黃柏服五劑熱減帶稀口和能食再去蘆筍冬瓜子枇杷葉加熟地枸杞烏鰂骨服之而愈又吳氏婦陡患咳嗽痰不甚多不能著枕者旬日矣神極委頓孟英察脈虛數授枸杞蓯蓉歸身石英龜板牡蠣冬蟲夏草麥冬牛膝胡桃肉之劑覆杯而病若失吳籙園患發熱嘔吐莖縮腹痛孟英診脈弦軟而數苔色膩黃曰熱伏厥陰也與楝實通草梔蓮茹斛絲瓜絡一劑知數劑愈朱生甫明經令郎萊云之室娩後月餘患間瘧孟英脈之虛數而弦頭疼腹痛苔色甚薄乳少善嘔乃營虛而邪客少陽也令郎斷乳庶免蓐勞劑以柴芩茹半桑楝延胡枇杷葉二帖嘔止腹不痛去楝實延胡加當歸四帖瘧罷能餐而頭尚痛再加杞菊服三劑頭不疼改用甘麥大棗加歸芍杞菊竹茹蒲桃干藕調之經行而愈陳氏婦季夏患瘧寒微熱熾舌紅不渴而思啖瓜果不飢不食二便皆通夜不成眠汗多神憊孟英審脈虛軟微數雖屬暑瘧邪不甚重惟營陰久虧不須重劑誅罰無辜以西洋參知母芩茹白薇麥冬西瓜翠衣為劑果三啜而瘳胡氏婦患瘧寒少熱多自云陰分素虧醫進清解涼營之藥多劑其熱愈熾改用養陰法嘔惡煩躁自欲投井或謂今年中伏之時風雨連朝人須挾纊有何暑熱而多服涼劑以致瘧來發躁必屬虛火擬以薑附治之病者云吾舌已脫液陰將涸矣堅不肯服而請決於孟英脈至滑數右寸關更甚視其舌淡白而光滑儼似無苔其實有苔如膜滿包於舌也證屬陰虛吸暑兼以痰阻清陽初治失於開泄耳授菖茹連半旋茯蘇枳枇杷葉為小劑取其輕清開上也兩服舌即露紅嘔止受谷瘧熱亦減又二服瘧竟罷孟英曰余亦初不料其若是之神也隨以清養善後而安高某以陰虛之體而患瘧於暑月久而不愈馮黃二醫僉用補養矣而杳不知飢欲噫不暢便溺艱澀渴喜沸湯孟英診脈緩澀不調按其胸次堅而不柔舌上滿布干黃薄苔曰氣機鬱結痰滯未行如何遽投補劑予菖貝旋蔞蘇桔連半紫菀枇杷葉為方四帖而愈始從調養以善其後嗣有王雨蒼仲郎之證治與此略同謝氏婦素體孱弱亦屬陰虛暑瘧久延舌色鮮赤醫投養血竟不見功孟英視之曰舌雖無苔色絳而澤此非脫液乃液為痰隔而不能上布故不生苔如果脫液詎能如是之鮮澤哉蓋痰雖因火灼成究是水液所結其潮氣上騰舌自不燥與茹貝菖蔞芩桔蛤粉枇杷葉等藥痰果漸吐三日後熱減知飢白苔漸布改用養陰清熱而瘳孟英嘗曰臨證必先辨其病屬何因繼必察其體性何似更當審其有無宿恙然後權其先後之宜才可用藥自然手到病除無枘鑿之不入矣又曰熱證有見白潤苔者亦痰盛於中潮氣上蒸也此不可遽施涼潤先宜開以辛通而昧者但知苔色白潤為寒證之的據遂不詳勘其兼證而妄投溫散燥補以誤事者多矣附錄於此學者識之沈峻揚令妹年逾五旬體素瘦弱不能寐者數夜證遂瀕危乃兄延孟英視之目張不能闔淚則常流口開不能閉舌不能伸語難出聲苔黃不渴飲不下咽足冷不溫筋瘛而疼胸膈板悶溲少便秘身硬不柔脈則弦細軟澀重按如無或疑中暑或慮虛脫孟英曰身不發熱神又不昏非中暑也二便艱澀咽膈阻悶非脫證也殆由情志鬱結怒木直升痰亦隨之堵塞華蓋故治節不行脈道不利也誤進補藥其死可必但宜宣肺氣行自愈方用紫菀白前兜鈴射干菖蒲枇杷葉絲瓜絡白豆蔻果一劑知四劑瘳胡某素患耳鳴且吸鴉片時服補藥漸至食減痰多舌上起灰黃厚膩之苔者三年矣多醫莫愈孟英脈之弦細軟滑曰真陰虧於下痰熱阻於上耳以西洋參菖蒲遠志麥冬竹茹蓯蓉歸身石英牡蠣冬蟲夏草少加黃連服之不半月痰少餐加舌苔盡退三年之病遂以霍然陳德齋令侄緝庵患瘧黃某連投小柴胡湯漸至熱勢加長撫之烙手時當盛暑帳幔不啟而不得汗神情瞀亂大渴苔黃脘悶欲嘔便秘溺赤孟英按脈軟滑而數身面膚赤乃暑濕挾痰轇轕於中氣機阻痹宜予清宣劑以菖茹蔞枳知滑芩連花粉枇杷葉竹葉西瓜翠服後痰即漸吐異日瘧來有汗病者臥於藤榻身穿西洋布汗衫短褲其汗但出於衣不遮蔽之處孟英適至診畢令裸其體汗即遍出熱亦尋退方不加減四劑瘧斷更衣胸舒安穀另以輕清肅滌餘邪而愈世人不論天時不究病因但知蓋覆以取汗者宜於此案探討其未發之義不可草草讀過也許子芍年甫冠平素飲食不節氣滯多痰偶患時瘧溺赤苔黃脈至滑數脘悶不飢孟英投清解藥一劑其門下醫者黃某云瘧疾以小柴胡湯為主方乃舍之不用而以竹茹大寒之品遏伏其邪菖蒲散心之藥耗損其神此病雖輕而藥已誤恐有變證病家聞而惑之次日即服其方病勢日進輒云菖蒲散心以致神氣不安竹茹寒滯以致邪不能解小柴胡方內加入桂枝首烏等藥狂熱尤甚黃復薦招任某會診交口以為開手一藥之誤恐延虛脫徑用生脈六味加龍牡杜仲續斷阿膠之類服之半月後病者目不能張畏聞聲響語出無音身挺而重不能轉側略一動搖則手足震掉如擂鼓然房中几案皆為撼簸黃任二醫僉云汗脫在即舉家皇皇其堂兄蘭嶼夤夜拉孟英往視脈甚弦疾曰病藥也其何能脫疏方以天竹黃竹茹竹葉竹瀝並用病者聞而咋舌謂一味竹茹釀成大病一方四竹能不殺人仍服任某補劑以冀留人而再治病也又旬日瘧徑不作至時惟腦後之枕骨與兩足跟著席身則反張如弓如是數刻則昏亂狂走醫者諉為祟病符醮水陸大費不貲而病如故既而黃某疽發於背任亦託病不出所親陳雪舫力舉孟英胸無畦畛不妨再懇其挽救病家計窮始為諄請脈仍弦疾而左尤堅搏且善啖而腹脹如石矣孟英曰幸而便通猶可無慮以旋覆赭石菖蒲膽星枳實黃連青黛整塊硃砂兩許合四竹為方調服蘇合香丸一劑而反張狂譫皆減病者云我今日如夢初醒而精神自覺惘惘次日仍用原方調以玉樞丹得瀉四次腹脹遂減反張狂譫悉蠲惟至時尚有氣逆肢掣耳乃去玉樞丹令吞送當歸龍薈丸大便日瀉胸腹漸柔又服五劑逆掣皆平改用沙參丹參石英茯神白薇梔子絲瓜絡貝母海䖳鳧茈等清理善後而愈孟冬已完姻矣嗣其僕陳福陡患身面如金便血吐血求孟英視之身熱苔垢而肢冷手紫脈至如絲曰此急黃證而兼血溢於上下即所謂瓜瓤瘟也藥不及救越日果亡黃某敦愛局瘍醫也年逾六旬忽患背疽聞服參茸等藥七日而亡夫背疽之敗何至如是之速必是暑熱為患而誤從溫托耳楊素園大令批仁術志云硃砂不宜入煎劑當生研少許調服愚謂硃砂但忌火煉不忌湯煎且整塊而煎僅取其氣較研服其質者尤無弊也余磵花印雪軒隨筆云刑幕鄭春潭患秋感發狂譫語喃喃若與人爭辨謂有二鬼向其索命乃索筆作遺囑處分身後事如是者數晝夜山右武君視之曰非鬼也病由邪熱未清遽服補劑耳如法治之浹旬而起設非武君不又為談因果者添一公案哉子芍之證亦猶是耳邱小敏初發熱即肢瘛腹痛臥則昏譫坐起即清膈間痞悶飲亦礙下舌色紫腫苔厚膩黃身面赤色齦腫而疼醫見其病情錯雜初以為斑疹之候進透發之劑渾身冷汗又慮內閉外脫灌以紫雪病如故又疑熱入血室用桃仁茺蔚丹皮藕汁童溲等藥又恐其虛用西洋參龜板等味遂言蹇呃逆正在彷徨適病者登圊更衣忽然昏暈謂欲虛脫欲進生脈散以固元氣舉家無措所親姜柳湖請孟英往診之脈洪弦而兼滑數病屬暑濕惟肝氣素郁肺胃多痰是以升降失常邪氣壅塞臥即神昏者乃濕熱上熏也故坐起則爽彼熱入血室乃晝明瞭而夜譫語非晝臥即昏夜坐即明也治宜清展氣機病必化瘧而解設以溫散表其汗則邪熾而津劫若以滋補固其元則邪閉而正脫誤用血分藥則引邪入營徒用寒潤法則遏邪不化先以雪羹梔楝旋枳連蔞芩半菖茹元參銀花絲瓜絡等出入為方吞當歸龍薈丸果轉為瘧各恙遞減連下黑矢半月後便色始正而瘧亦止胃醒安穀而瘳停藥數日偶因嗔怒其瘧復作寒少熱多睛赤齦疼汗多足冷孟英曰餘熱逗留風陽內煽也視其苔灰黃夾黑因謂其弟桂山曰但看黑苔退淨則邪自清矣仍予元參白薇知芩梔茹銀花木通絲瓜絡菊葉等送龍薈丸瘧即遞減逾旬苔淨眠食如常而起矣陳雪舫令郎小舫年甫冠人極清癯偶患瘧醫與柴葛羌防數帖遂不飢不寐胸膈阻塞湯水不能下咽壯熱神疲汗出不解二便秘澀舌絳齦疼齒縫血流凝結於齶孟英持其脈細而數有下厥上竭之勢而肺未肅清宜用輕劑以葦莖冬瓜子紫菀元參通草枇杷葉旋覆滑石蔞皮西瓜翠衣為方數啜而安嗣用養陰西洋參不過一錢生地不過三錢緣其稟賦極弱不但攻散難堪即滋培稍重亦痞悶而不能運也耆術之類更難略試故量體裁衣乃用藥之首務也傅與三令正年已花甲患瘧服藥浹旬而斷乃夜不能眠者數日忽然吐瀉交作肢冷自汗渴喜熱湯神氣張皇而有譫語張某謂元虛而所用之藥乃桂芍萸連葛藿烏藥木香之類病家欲投溫補迎孟英質之脈來浮弦軟數尺中甚弱舌絳無液稍有黃苔乃真陰素虧久傷謀慮吸受暑熱化瘧未清擾及中州則為吐瀉詢所吐果有酸甘苦辣之味瀉亦色醬而熱如火豈非伏熱之的據耶然邪已自尋出路故腹無痛苦況汗出如淋不獨用香燥疏散之藥為耗液即溫補如理中四逆亦無非助熱而重劫其津也乃定沙參龍牡朱染茯神黑豆皮薏苡木瓜小麥竹針鮮蓮子之方一劑則吐瀉皆止得寐神清且略知飢稍能收谷次日復診病者云依舌上脫液者三十年矣是以最怕熱藥奈群醫謂瘧宜溫化以致愈服愈殆設非先生眼光如炬恐昨日已登鬼錄矣尋以充液柔肝而愈高魯川家兄禮園之外舅也年近古稀新秋患感顧某進清解藥二劑熱即退以其年高遂用滋養越日復熱謂欲轉瘧改用厚朴薑棗等藥遂熱壯神昏速孟英視之脈形滑數舌心已黑溲赤乾嘔粥飲不入亟予元參知母花粉銀花竹茹枇杷葉蓮子心梔子白薇西瓜翠衣為劑數帖霍然呂慎庵云余於去冬行路過勞兩足劇痛調治至今年春杪似覺小效而陰頭覺冷因食牛骨髓以冀收功遂患便濁莖中梗澀時欲小溲腰脊板痛俯不能仰清心益腎之品備嘗無效秋初拖舟直詣潛齋請診孟英先生曰膽經鬱火未清所服牛髓壅氣助火是猶適燕而南其指矣爰定沙參四錢直生地六錢淡當歸一錢女貞三錢旱蓮三錢鹽川柏一錢酒龍膽八分生薏仁四錢川楝肉錢半絲瓜絡錢半生甘草梢六分砂仁八分研沖一方服十劑溺澀已減腰足猶疼請改方先生以沙參四錢生地六錢淡歸身錢半絡石四錢柏子霜三錢淡肉蓯蓉一錢酒川柏一錢川楝肉錢半鮮竹茹三錢藕汁一杯和服為劑亦服十數帖證去八九而小溲猶渾有穢氣先生令以虎潛丸料熬成膏藕粉和杵為丸服至三料小溲清暢粗健如常是證也歷半載有餘屢訪前輩證治未有毅然直指病源如先生者獲痊後銘感無既隔垣之視允宜垂世敢贅數言以備採輯陳載陶年五十五歲患瘧兩旬始迓孟英診之脈不浮而弦滑且數按之愈甚苔色黃膩滿布熱至大渴極喜冷飲小溲赤臭熱時則點滴莖痛大解不行間數日則略下稀水是暑熱挾痰見證疏清解法予之及閱前醫之方初則柴桂薑棗嗣用參甘耆朮首烏草果之類溫補雜投其瘧日甚其發日遲其補日峻其口日渴乃令熱時少飲西瓜汁一二杯病者飲瓜汁而大快輒恣飲一二碗蓋謂其體厚陽虛中氣不足故溺赤而便稀水又云暑是陰邪熱自濕來不可稍犯寒涼之藥因仿景岳治陰虛傷寒以冷水與桂附並行之例而令其服溫補以治瘧少佐瓜汁以解渴也噫景岳此案之不可為訓葉香岩發揮於前魏玉橫辨謬於後奚可尤而效之乎治而勿愈反責病人過飲瓜汁使然余謂此證苟非日飲瓜汁一二碗早已液涸痰膠燎原莫救矣病者聞而頜之服數劑胸前赤斑密布瘧渴皆減溲漸通苔轉白前醫云再不溫補恐其驟變病者惑之仍服其藥並加鹿茸附子又旬余瘧如故而形瘦面黧氣衝干嗽白糜滿舌言蹇無眠醫者皇皇病家慼慼復延孟英視之脈仍數曰邪較衰矣西瓜汁之功也陰受劫矣溫補藥之力也極早回頭尚堪登岸爰以西洋參生地甘草石斛白石英葳蕤麥冬黃連阿膠牛膝為方並令熬鱉汁飲之五劑而瘧罷嗽蠲得眠安穀苔亦全退但舌紅口辣溲赤不清前方去連膝加歸杞服八劑始解堅燥黑矢而愈然病者喜溫補既愈仍囑前醫善後故舌紅口辣與胸前斑點久不能消直至冬令孟英力勸停藥始漸除也有朱湘槎者與載陶年相若體相似也秋杪自越患瘧旋杭屢藥不應遲孟英視之面赤脘悶二便不行熱則譫言苔焦口渴予小陷胸湯加菖茹梔翹花粉竹葉等藥群謂肥人之體慮虛其陽不敢服此涼劑治載陶之前醫迎合主見大投溫補載陶偶見孟英而述之孟英曰湘槎殆矣此時恐無西瓜汁以救藥誤也旬日後果狂躁而亡其未亡前一日人已昏狂畢某診云暑熱內陷意欲挽救投以犀角等藥一帖故前醫於陳證由攘為溫補之功於朱證則卸為犀角之罪蓋明知溫補易售可以避罪徼功故樂操其術而不肯改弦易轍也後載陶令兄喆堂喬梓同時患瘧因前車之鑑雖汗多懶語酷類虛象不敢從補均依孟英作暑濕內伏治而愈家嫂患疥遍身外科治之不愈且形瘦而左臂痠疼不能舉孟英按脈弦洪而數授清肝滌暑之劑旬余而愈又聞治一妊婦患疥瘍科治而弗愈以靈壽寺所售瘡藥搽之遂渾身壯熱膚赤神昏陰戶疼腫尤為慘酷氣逆不飢徹夜無寐醫皆無策延孟英視之脈甚洪數舌絳無苔四肢拘攣溲熱如火乃暑火證而復為毒烈燥熱之藥助其虐也誰謂外治不比內服可以擅用哉與大劑銀花元參石膏甘草梔子鮮生地竹葉蓮子心菊葉冬瓜皮絲瓜絡西瓜翠衣而以綠豆黑豆煮清湯煎藥服三帖膚淡神清略進稀粥又三帖熱退始盡四肢漸舒浹旬腫盡消周身膚蛻如蛇皮而愈家慈年七十四歲陡患泄瀉腹微痛身發熱神思不清自汗嘔惡不進飲食亟延醫視云慮其脫擬進參藥迨孟英來診曰暑脈微弱不可謂之虛也且兼數象參不可投高年固屬陰虧然去其所本無即所以全其所本有也爰定芩連滑斛茹柏竹葉銀花橘皮枇杷葉之方東瓜湯煎藥一劑而熱退神清二劑霍然矣既而五弟婦偶患微寒發熱醫與柴芎等藥一劑遂昏狂悲哭見人輒怒詈欲搏屈孟英過診脈弦滑而數面赤不瞑苔色黃膩胸下拒按曰痰熱肝火為患耳以菖蒲膽星旋赭連蔞枳半合雪羹投之一劑而安翼日寒熱復作孟英曰幸其體實藥不可緩庶免化瘧也照方服五劑果寒熱三作而遂痊蔡湘帆之女甫周歲斷乳後患腹膨泄瀉兒科以為疳也遍治不愈謂其將成慢驚丐孟英視之苔甚白滑曰瓜果傷也以生厚朴生蒼朮丁香柄雞膍胵五穀蟲陳皮苡仁木香黃連防風投之服後連下十餘次而腹即消次日竟不瀉而能安穀矣聞者僉以為異或云尤有異者許子雙大令令愛宜姑幼時患發熱神昏幼科皆束手矣孟英偶一望見曰犀角證也與以方果投匕而瘳此案輯仁術志者失採今子雙宦粵東不能詢其詳矣姑附其略於此以識望而知之之神關琴楚令孫少西年三十四歲素善飲夏間已患著枕即嗽諱而不言家人未之知也迨秋髮熱嘔吐腹痛伊父母以為痧也諸痧藥遍投之尋即氣衝咳嗽血湧如泉不能稍動動即氣湧血溢沈某但知其素稟陰虧遽從滋補服後益劇遲孟英診焉脈弦洪而數曰雖屬陰虛但飲醇積熱於內暑火外侵而加以治痧丹丸無不香竄燥烈誠如火益熱矣亟當清解客熱昔孫東宿治族侄明之一案與此略同必俟熱退血止再為滋養知所先後則近道矣病家素畏涼藥而滋補又不應遂求乩方服之藥甚離奇並木鱉麝香亦信而不疑旬日後血已吐盡氣逆如奔不寐形消汗多熱壯再乞診於孟英已不可救藥矣沈友聞令郎厚栽久患羸弱馴致腹痛便瀉惡谷形消諸醫束手求孟英圖之脈虛弦而空軟曰不可為矣雖然治之得法尚可起榻可虞者其明年春令乎爰以潞參鱉甲耆芍甘柏薏斛木瓜橘皮為方吞仲景烏梅丸不旬日而便堅食進又旬日即下樓而肌充矣又其大令郎子槎之室體素怯夏間曾患久瀉多劑溫補始瘳忽發寒熱肢麻頭痛徹夜不眠嘈雜如飢咽喉似阻食飲難下汗僅出於上焦僉以為虛損將成孟英持其脈弦弱而數視苔微黃滿膩曰暑濕時瘧也補藥烏可投耶以茹滑芩連桑葉紫菀銀花橘皮冬瓜子枇杷葉絲瓜絡等藥蘆根湯煎服數劑而痊嗣與滋養善其後既而子槎自上海歸亦患瘧孟英視之暑濕挾痰也予溫膽湯數服而愈次年春杪厚栽竟逝陳氏婦年逾四旬娩後忽然發狂時值秋熱甚烈或以為受熱移之清涼之所勢不減或以為瘀投以通血之藥而不效金顧二醫皆謂虛火進以大劑溫補則狂莫能制或云痰也灌以牛黃丸亦不應浼孟英視之切脈弦數頭痛睛紅胸腹皆舒身不發熱乃陰虛而肝陽陡動也先灌童溲勢即減劑以三甲二至丹參石英生地菊花牛膝藕用金飾同煎一飲而病若失愈後詢之果因弄瓦而拂其意耳吳曲城仲郎偶患少腹堅脹左脅聚氣群醫見其面黃作暑濕治攻補雜施兩月弗效孟英視脈弦澀溺赤便艱口苦不飢肢冷形瘦曰非外因也肝鬱耳予旋覆花湯合金鈴子散加雪羹竹茹青皮白芍煎吞當歸龍薈丸八劑而病如失矣濮樹堂患滯下醫者以其脈弱體虛第三日即參補養延至匝月痛痢不減穀食不思肌瘦如豺面浮足腫口乾舌絳懶語音低氣短汗多略難轉側諸醫無策始迓孟英診之曰初起脈微弱為暑之本象今按之尚數乃陰液已傷渴飲無苔豈容溫補溲赤而痛胡可酸收見證雖危治不可紊為定白頭翁湯加西洋參乾地黃炙草白芍麥冬阿膠酒炒銀花之劑以水露煮陳倉米湯煎藥群議以為太涼潤不可輕試孟英曰此厥陰證而胃液已傷幸而脈未空數浮弦亟予養陰清熱庶可圖功若徒議藥不議病縱有一片婆心未免好仁不好學矣病者憶及乙巳之病深信不疑遂服之一劑知六劑而痢淨舌潤知飢溲通得睡第便溏腹痛日必兩行左齦赤腫而疼外塗以玉樞丹內治以三奇散加潞參炙草薏仁扁豆雞膍胵黃柏橘皮吞香連丸旬余而浮腫消大便堅舌苔生起於榻而口腹不節發熱口乾乃食復也按法治之熱退至七日始更衣因囑其加意珍攝俾易康痊奈家務紛繁既愈即不能靜養神機曲運心氣渙散不收液涸津枯而前功盡墮惜哉然此案自可傳也孫位申令正左內踝患一瘡外科敷割雜治兩月漸至瘡色黑陷食減神疲寒熱時形痛無停晷始延孟英診之脈象弦細無神曰此營陰大虧之證余於外科雖疏然初起既無寒熱患處亦不紅腫其非火毒可知並不流膿虛象更著始則攻散劫津繼則溫托壅氣妄施敷割真是好肉剜成瘡矣況病在下焦素患肝鬱耆茸芎歸益令陽浮兩腿不溫豈為真冷亟煎蔥湯將患處洗淨切勿再行鉤割以生附子杵爛貼湧泉穴引火下行患處日用蔥湯溫洗方用血餘當歸冬蟲夏草枸杞牛膝蓯蓉豬膚藕白蒲桃干煎服五劑寒熱全休腿溫安穀黑處轉紫痛減脈和旬日後紫轉為紅陷處日淺始令以珍珠八寶丹糝之匝月而肌生體泰沈陶安寒熱初作醫用溫散藥即眩悗不安延孟英視之舌絳無苔大渴多汗瘧則寒微熱甚發時咳嗽兼嘔溺少不飢脈洪且數清癯之體陰分素虧而伏暑化瘧也予知芩茹貝花粉白薇銀花元參枇杷葉紫菀冬瓜子等藥出入為方服後連解赤糞瘧即遞輕不半月而愈乃兄秋粟賈於蘇因八月初五日上海寇警吳門震恐遂踉蹌旋里迨十七日忽發瘧但熱無寒汗多昏譫脈亦洪數嘔嗽溺頻曲糵素耽體豐痰滯孟英即以治陶安法佐以開痰治之溏解頻行其色皆赤伏邪雖有去路緣心陽過擾譫渴不休加犀角竹葉蓮子心之類至月杪診時適大戰大汗之際其家疑為有祟方在禳禱鐃鼓喧闐病者神氣更不安恬孟英令將醮壇移遠並灌以神犀丹一丸其家問此證何不用石膏孟英曰藥有定性病無定形況旬日以來苔退將淨瘧即可罷何必石膏次日乃叔蘭谷另邀一醫視之方雖相似而迎合主人之意加入石膏三錢冰糖四錢粳米一兩連進兩帖左脅即痞脹不堪按之如柈杳不思谷病者悔恨云月杪大汗之後吾瘧已休何以更醫致生痞脹仍迓孟英診之脈來澀滯苔復膩黃因詢曾服滋膩之藥乎陶安始述其所以孟英曰石膏為治暑良藥吾非不善用者因此證不止肺胃二經受暑心肝二經皆有所病故不用也且內挾痰濕者雖當用亦必佐以宣化之品辛丑夏家篪伯茂才患瘧初起誤服此公石膏兩劑腹遽脹延成瘧鼓幾至不起後服多劑桂附及金液丹而始愈蓋此公但見其瘧至睛赤裸衣狂走而不研察其病情也余究其因遽云瘧發時其熱自下而上比至心頭即覺昏冒且口不渴而惡涼飲乃濕上甚為熱之證彼時若以蒼朮同用則濕熱之邪一齊同解奚至延鼓哉賢昆仲之瘧熱亦自下而上系挾肝陽上升故熱升則必嘔嗽而令兄更有伏痰故余劑中多用連夏菖蒲滑石之類以化之今瘧罷熱去之後痰濕未清石膏已誤再佐糖米之甘緩俾膩塞而不行苟不急為宣導則鼓脹之萌也遂以蔞薤菖枳連夏旋橘楝實延胡雞金雪羹之類出入互用至二十劑痞始泯然粥食遞加苔亦退盡而竟不更衣改用參歸杞芍橘半蓯蓉首烏鱉甲等十劑大解始下堅黑異常連解數日始淨隨予峻補善後而痊秋粟之室懷妊九月加以憂勞九月初七日患瘧間作寒熱之時胎痛上竄或下墜腰疼更兼痰嗽帶下口渴無苔其勢甚危孟英但於清解之中加蔥白蘇梗投之連下赤矢痛勢遞減第瘧雖漸殺至期必兩發病者苦之孟英曰愈機也毋憂焉果浹旬而愈復苦脘痛嘔吐勺水不納藥亦不受授以藕汁蘆根汁梨汁少加薑汁和入薔薇露枇杷葉露香櫞露徐徐呷之漸瘥嗣予滋養藥加黃柏服之而愈迨冬至分娩甚快健又秋粟令郎十歲陶安令愛八歲俱患間瘧僉慮胎瘧難瘳孟英曰無是理也小兒內無七情苟能慎飲食較大人易治焉劑以清解旬日胥痊施玉林之侄順老患瘧失治自頭至足龐然浮腫溲赤便溏不飢痰嗽孟英授杏樸橘半蘇滑桑皮通草銀花冬瓜皮蘆菔為方服六劑瘧愈腫消便堅溲暢而善飯矣陳載陶令郎夏間患嗽瀉愈後時發微熱寢汗如蒸醫治兩月迄不能退時猶作嗽咸以為勞其世父喆堂逆孟英視之熱甚於頸面形瘦口乾脈則右大曰肺熱不清也養陰之藥久服勢必弄假成真熱錮深入而為損怯之證亟宜澹泊滋味屏絕補物以芩梔地骨桑葉苡仁枇杷葉冬瓜皮梨皮葦莖為劑服後熱汗遞減至九帖解醬矢赤溲皆極熱而臭自此熱盡退而汗不出矣惟噫猶不暢時欲太息飽則胸下不舒乃滋膩藥所釀之痰未去也改用沙參枳實旋覆冬瓜子竹茹白前栝蔞海䖳橘皮數帖而胸舒嗽斷體健餐加張某患四肢發熱久治不痊食減便溏汗多形瘦張孝子謂此證非孟英不能愈遂往就診曰熱厥也前此必誤服補藥矣故脈來甚澀以芩梔連柏白薇通草地骨青蒿絲瓜絡為方十餘劑而瘥董茂清患瘧脈軟脘脹手紫面黃便秘溺紅苔膩而渴孟英曰暑濕挾穢氣阻於募原用菖樸橘半杏滑芩翹蔞枳銀花加雪羹出入為方服五劑便瀉知飢瘧休而愈陳誦芬令堂年越古稀精神素旺滯下數月病日以劇所親蔣策熏囑延孟英圖之已粒米不納雖啜飲而咽膈阻塞唇舌皆紫痰中帶血吐之甚艱日夜更衣數十次稀糞挾以赤垢若欲小溲必令人重按肛門始能涓滴而出熱如沸湯脈則左手弦洪澀數而上溢右軟滑而大按之無神孟英曰此證本滯下良由七情鬱結木土相乘醫謂高年輒投溫補釀成危證藥不可為誦芬云先生之言是也家慈因春間疊聞江南之警心甚皇皇舉家遷避飲食頓減夏初旋里似已稍安六月間患瀉飲食又減屢進參朮熟地附桂炮姜之劑竟無寸效惟望鼎力斡旋是幸孟英曰上不能納下不能分中氣無權營津兩匱既承下問姑擬一方僅許小瘥不能奏績也誦芬從之服後即思粥食小溲單行再求轉方孟英堅不承手果至季秋而沒其方乃沙參冬瓜子絲瓜絡蘆根紫菀菖蒲竹茹通草薏仁枇杷葉陳倉米以水露煎服也顧鐵舟贊府精於醫者也目擊其一服而進粥溺行因嘆曰仙方也惜遇之不早命矣夫徐仲榮四令弟德生患感至旬余忽然大戰大汗而大便兼下瘀血朱茂才視之不知戰解之義以為將脫也率投大劑溫補藥一服汗收壯熱杳不知飢渴飲無眠舌赤溲少遂束手更醫謂汗下傷陰滋填疊進馴致身難轉側懶語音低者又旬余矣所親吳愛棠囑延孟英圖之脈弦數而駛按其胸下堅且痛舌絳而根苔黃滯曰汗下傷陰固然惟府猶實也滋膩曷可投耶然一病至此又難攻奪姑以善藥通之因予小陷胸湯合雪羹加茹杏紫菀白前冬瓜子蘆菔和梨汁服二帖堅黑之矢果下仍夾瘀血身熱遂緩稍進稀糜改用清養肺胃以充津液旬日後熱淨溲澄知飢安穀惟舌不生苔寐即汗出授大劑滋陰而愈德生有一婢年十七矣陡患腹痛稍一言動則痛不可支舉家疑為急痧中惡多方以圖皆不應飛速孟英往視見其神色如常並不吐瀉脈則牢澀苔則膩黃曰此多食酸甘而汛阻也詢之果然以桃仁紅花生蒲黃靈脂海䖳香附延胡芍藥蘆菔湯煎藥吞當歸龍薈丸而愈許梅生仲郎恬甫年未冠仲秋患感醫知其陰虛伏暑也疊進清衛涼營之法旬餘熱退以為無慮矣惟六日不更衣因用生地麻仁花粉等藥服後果欲大解及登圊大瀉一次人即汗暈急扶上榻連瀉二三十次滿床皆汙盡是黃水身復發熱肢痙音低唇焦齒槁苔色干黃而渴舌不能伸目不欲張速孟英勘之脈微細欲絕而呼吸甚促按其心下堅而且痛曰疾不可為也緣初治失於開泄胸中痞結而津液不能敷布盡從下脫攻補皆難措手矣翼日果殞許蘭嶼令正素屬陰虧舌常脫液季秋患脘下疼脹得食愈甚映及脅背宛如針刺稍閤眼則心掣動而驚寤自按痛處則湧水苦辣渴不欲飲溲少神疲自疑停食服楂曲而益劇孟英視脈弦軟曰此停飲也飲停則液不能上布故口渴而飲即水也內有停水故不喜飲其舌上脫液雖屬陰虛亦由飲隔寐即心掣者水凌火也得食痛加者遏其流也以芩澤橘半旋蛤連䖳加生薑衣投之溲行得睡惟晚食則脘下猶疼疼即心熱如火且面赤頭痛腿冷腰痠必俟脘間食下則諸恙皆平孟英曰此停飲雖蠲而肝火升也宜參潛養為治矣改授沙參蓯歸竹茹楝柏石決明絲瓜絡薑汁炒梔子少佐生黃連服之遂愈蔡湘帆年二十歲體素豐偶發寒熱翼日尚吃飯出門自不知為病也第三日寒熱大作莖縮不能小溲氣喘大汗眩暈不支乞孟英往診舉家倉皇大哭循其脈緩大而滑苔色黃膩脘下拒按曰無恐也予菖枳旋蔞梔豉連半茹䖳以蘆菔湯煎服一劑大吐痰涎而喘汗平二劑莖舒溲暢而大解行越日寒熱即減又兩劑瘧罷知飢而愈然李東垣諄諄以內傷類外感為言而溫熱暑濕之病初起極類內傷往往身未發熱而手心先熱或兼眩暈自汗設泥古法而不辨證禍可言哉葉承恩年五十歲患發熱暮甚肢厥頭疼嘔惡便溏睡則囈語不飢不渴汗出上焦自覺把握不住延孟英診之脈軟澀而不鼓指右手尤甚宛似虛寒之證惟舌本紫苔雖薄而黃膩口苦眼鼻時覺出火是真陰素虧而熱伏於內也予梔連桑菊茹翹芩斛銀花絲瓜絡蓮子心出入數劑熱囈皆減脈亦較和溲赤而疼大解色醬知其伏熱下行矣又數劑苔始退而知飢參以養陰而愈一勞力人發熱左脅疼咳嗽礙眠痰出甚臭苔黃舌絳渴飲譫語便秘溲赤脈形滑數乃伏暑證詢其平昔嗜飲醉後必向左臥故濕熱釀痰久積於左非內癰也以葦莖湯去苡仁加雪羹芩滑茹翹梔蔞旋覆木通等出入三劑大便行譫語止而痰出更多其臭益甚仍用前藥又四劑痰始少而不臭熱淨能眠知飢苔退改授甘涼養液而瘳陳芷潯主政患瘧跗腫便溏痰多食少時欲嘔吐間有鄭聲孟英取其脈微弱而弦不渴無苔小溲不赤乃中虛寒濕為患也方以六君去甘草加桂枝苡仁白芍吳萸投劑即減半月而愈周光遠令正孀居十載年已五十三歲汛猶未絕稍涉勞瘁甚至如崩偶患少腹偏左掌大一塊作疼其疼似在皮裡膜外拊之痛甚越日發熱自汗眩冒譫語嘔渴不飢耳聾煩躁孟英循其脈虛軟微數左兼弦細便溏溲熱舌本不赤略布黃苔營分素虧而有伏熱阻於隧絡重藥礙投姑予芩連芍楝竹茹桑葉白薇通草橘核絲瓜絡燈芯少加硃砂和服一劑勢即減二劑熱退嘔止啜粥神清第腹猶痛去桑芩燈芯硃砂加蓯歸苡藕服數帖而起迫季冬其君姑七十八歲患腹痛痛亦僅在皮膜仍能納食二便無疴數日後痛及兩腰機關不利礙於咳嗽痰出甚艱而有鹹味夜不能瞑孟英視曰肝腎大虛脈絡失養也以沙參熟地歸杞蓯膝杜仲石英羊藿絡石薏苡胡桃等藥進之日以遞愈繼用一味桑椹善後而康四舍弟西甫年二十四歲秋杪患感至六日神漸昏延孟英診之脈形澀滯苔垢頭疼氣逆汗頻腰疼溲少脘悶拒按乃伏暑晚發而本元極虧也亟與開中俾有去路小陷胸加梔豉菖芩白薇翹枳蘆菔湯煎服一劑脘不拒按苔亦稍退汗不達於下部脈來軟而且澀改授茹半芩梔橘翹知蛤花粉蓮子心之劑三帖脈轉弦數大解未行譫語不休夜間熱熾腿涼頭暈濁熱上熏也以芩蔞梔連茹翹元參白薇丹皮海䖳竹葉投之乃下堅黑大便而圊後神暈苔漸薄而轉黑為去芩連蔞䖳加犀角鮮生地知母花粉兩帖更衣仍黑氣乃漸平腿亦漸溫熱渴均減猶不知飢脈軟而虛苔退未淨乃去犀翹加西洋參麥冬銀花菖蒲服三劑又解黑矢舌色始津而寐不安神汗多心悸因去知母花粉丹皮加甘草丹參茯苓而地黃用乾者兩帖大解甚暢胃漸知飢稍漸稀糜力不勝啜脈亦虛大寐即神馳乃邪未清而虛畢露也用西洋參生地龍齒歸芍芩甘連柏麥冬小麥服五劑復下醬矢而右脈尚虛大又六帖糞色始正汗減神安脈漸柔和寢食乃適嗣又食複數次賴孟英活潑如龍隨機應變竟以告愈洵屬再生四弟婦懷娠臨月西甫起病之次日即患瘧因弟病日劇不免憂勞至第五日孟英視之脈欲離經腰疼腹墜伏暑化瘧將娩之徵以梔豉蘇歸芩連茹半知母蔥白服兩帖而產產後瘧來頗減惡露不行腹不脹疼不飢而渴投梔滑薇茹澤蘭丹參通草桃仁茺蔚藥一劑惡露即行而狂言不寐面紅口渴人皆危之蓋杭諺有云夫病妻懷孕鐵船過海難逃命未產先縈憂懼既娩血去火炎故晝夜輒以鐵船沉海云云孟英於前方去澤蘭通草加琥珀菖蒲膽星燈芯和以童溲投之一飲神識漸清再劑即安睡矣去琥珀菖星桃仁燈草茺蔚加知母麥冬甘草沙參枇杷葉衝入藕汁一杯三服解赤矢而苔退瘧亦減而嗽痰改用沙參枇杷葉冬瓜子甘斛梔薇茹翹兩帖嗽減猶渴而身痛去梔薇枇杷葉加歸貝鱉甲四帖而瘧罷眠食鹹安調養至彌月即出房矣三舍弟拜楓之室汛後患感孟英視曰冬溫也而營分素虧左腹聚氣肝陽爍液痰阻樞機脈數而虛黃苔滿布腰疼礙於呼吸口淡不飢不渴嗽則欲嘔溲熱便秘當變法治之初授蔥豉連楝梔薇延胡絲瓜絡竹茹少加蘇葉服二劑解溏矢苔稍化而身熱退起榻梳髮復發熱脈尚數改用南沙參枇杷葉橘斛梔薇芩翹蘆菔服二帖脈數漸退大解復行心悸汗多時或發熱間有譫語脅痛不飢苔色根黃即參養血以北沙參歸身石英丹參茯苓黃連葳蕤甘草小麥紅棗核為方服三帖虛熱不作譫語亦休大解已堅夜不成寐不飢胸痞痰滯未清也為去後四味加竹茹半夏鹽橘紅薑汁炒梔子二帖痰果吐胸漸舒仍不知飢神疲不語脈甚細軟乃去芩連梔半加石斛麥冬冬瓜子藕而易沙參以西洋參用陳倉米湯煎藥和入野薔薇露服五帖脈漸起神亦振七帖後知飢而苔花少液去竹茹冬瓜子薔薇露加甘草生地白蒲桃干服二帖粥食雖增耳鳴神憊復加枸杞而地黃用熟者易洋參以高麗參服後苔淨加餐再加黃耆杜仲而愈惟素患帶多仿虎潛法善其後汛至而康五舍弟樹廷時患喘逆初冬尤甚稍食甜物其病即發孟英察脈遲弱苔黃垢而不渴指冷腿痠乃中虛痰濕內盛也授參朮蒼枳旋半薤樸杏仁生薑之劑服後痰果大吐氣亦漸平嗣以六君去甘草加當歸木香調補而痊沙沛生鹺尹令堂年五十七歲體素弱而多怫鬱秋間患瘧於諸暨醫治未效冬初來杭謝某疊進溫補其勢孔亟寒微熱熾昏譫瘛瘲目不識人舌絳無液苔色黃燥便秘不行延孟英視之脈洪滑右甚左手兼弦乃痰熱深蟠內風煽動也予知母花粉蔞仁竹茹各三錢佐以梔薇翹貝橘紅蓮心一飲而更衣溲暢胸次較寬痰嗽口糜且知頭暈乃去知母花粉蔞翹加沙參苡斛麥冬野薔薇露次日瘧來甚減糜退口乾神憊音低津虛痰滯也去苡仁枇杷葉薔薇露加知母花粉各一錢五分甘草五分和入藕汁一杯服二帖瘧至甚微口乾倦臥脈則右虛左數用養氣充津蠲痰清熱法西洋參鹽橘紅歸甘杞斛冬茯茹蕤和入藕汁服兩帖瘧休神爽咽痛唇糜飢不能餐余焰內燃也去杞斛甘草加生地牛膝四劑後咽唇皆愈神憊懶言仍加杞子甘草服二劑胃氣漸蘇口猶少液因涉嗔怒暮有微熱膚腫欲嘔口乾便秘即去地冬蕤杞甘膝加連楝蒺藜石英絲瓜絡冬瓜皮一啜熱去嘔蠲而腹猶脹去西洋參歸身冬瓜皮石英黃連加沙參旋芍延胡香附藕一劑脹消而口淡便秘飢不能餐改用西洋參木瓜銀花延胡蒺藜蓯歸芍斛為方投匕而便行三啜而腫盡消始予高麗參紫石英橘半歸冬菖茹牡蠣調養續去菖半加杞地鱉甲而愈嗣因登圊跌僕而發寒熱周身骨痛會陰穴起一瘰甚疼乃以高麗參骨碎補合歡木瓜杜仲絲瓜絡鹿角霜首烏鱉甲杞柏歸甘苡膝蓯斛等出入為方外用蔥白杵爛蜜調傅患處七日而痊沛生令庶母亦在越患瘧來杭後孟英視之脘悶欲嘔汗多頭重脈來弦數苔色膩黃乃餘邪逗留兼挾肝鬱以枳樸芩半茹斛蔞菖加蘇葉炒黃連投之痰涎大吐邪已外越脘脹口乾寒熱復作乃去樸半而加艽翹吐猶不止聚氣上衝渴飲無眠筋瘛便秘改用金鈴子散合雪羹加旋赭茹半薑汁炒梔子蘇葉炒黃連一飲而嘔渴減氣下行即去金鈴子散旋赭加沙參歸斛服五劑各恙皆安神憊汗多為用沙參歸斛芩橘梔連茹藕二帖又因嗔怒左脅作脹苦渴不飢暮熱便秘於前方加柴芍金鈴子散一啜脅脹即舒惟氣衝口苦飢不能餐自汗耳鳴頭左筋惕改授沙參當歸鱉甲石英竹茹牡蠣蒺藜菊花絲瓜絡服旬余眠食皆適但暮則火升口乾易汗去蒺藜絲瓜絡加黃連麥冬合甘麥大棗湯服浹旬經行腰痛頭震耳鳴八脈久虧也調養奇經以善後而康沛生令寵平素陰虛肝旺而腹有聚瘕時脹時疼初冬患瘧苔黑口乾孟英脈左弦數而洪右滑數而溢初以梔豉合金鈴子散雪羹加元參白薇竹茹服四帖疼脹皆減瘧緩汗多溲澀口乾飢不能食氣時沖逆予沙參歸斛茹橘石英絲瓜絡蛤殼藕二帖後汛行腰痛口渴少餐氣鬱營虛兼有痰滯也去蛤殼加旋覆冬瓜子花粉兩帖而更衣乃暢然猶脘悶不飢汛少且黑口渴頭疼瘧亦未罷乃去石英旋覆加梔滑枳實四劑各恙皆安瘧猶未斷以歸蓯甘杞橘半蔞芩竹茹花粉少佐桂枝調其營衛奈病者因口苦而惡粥食嗜啖甘酸病既曲折邪益留戀此方服至半月而瘧始休惟宿瘕時痛肛痔便難口苦吞酸神疲寢汗去芩桂甘草花粉加鱉甲烏鰂骨白芍延胡仙靈脾藕出入調補而痊德清徐子瑞令正屢次墮胎復多憂鬱汛行之際患瘧經止而兩耳驟聾雖對面疾呼亦不聞也不飢不渴不語不眠便秘遺溺仰面靜臥而已惟熱至則昏譫欲厥乃父沈悅亭謂其熱入血室拉孟英視之脈滑數而右大按之皆虛兩尺尤甚胸下拒按曰此下元虛損故耳聾若是即精脫之徵豈可因汛遽止而輒通其血乎然氣鬱痰凝苔色白膩上焦邪實補且緩商先予小陷胸合蠲飲六神湯加雪羹開痰行氣悅亭韙之三服便通胸不拒按苔化黃色瘧即較輕改以沙參歸斛茹半翹芩菖橘甘艽五劑瘧止漸思飲食二便皆調兩耳仍聾脈形細弱乃用大劑培養藥善後而愈沈南臺年三十七歲初冬在鄉收租將歸飽啖羊肉麵條途次即發熱頭疼到家招沈某視之謂其體豐陽氣不足以致傷寒夾食表散消導之中佐以薑附數帖後熱壯神昏諸醫束手交八日所親許錫卿吳久山交薦孟英圖之苔色黃膩口不甚渴粒米不沾時時火升汗躁譫語溲赤便秘面晦睛紅呼吸不調胸前拒按脈則虛軟微帶弦滑不甚鼓指曰體氣素虧然脈證太覺懸殊必因痰阻清陽故氣壅塞而脈更無力也劑以小陷胸合雪羹加旋菖薤枳梔子膽星服後痰即吐脈較起再服譫語息三服痰中帶出紫血數塊四服熱退而汗躁胥蠲七服苔淨胸舒溲長口渴改予甘涼濡潤之法服數帖痰已漸少舌布新苔而仍不更衣覺有穢氣上衝亦不知飢仍予甘涼養胃佐以蘭葉野薔薇露降其濁氣數帖後穢氣除粥食進但不大解家人憂之孟英曰既無所苦能食脈和靜俟水到渠成不可妄行催動也既而加谷起床便猶不解病者停藥旬日計起病已交一月矣粥嫌不飽意欲食飯復請孟英商之孟英曰可食也藥則不當停亟宜培養涵濡俾其轉運也授參朮歸蓯杞麻半芍少佐枳殼為方服十二劑始得暢解堅矢嗣與峻補善後尋即復元續有宣氏婦脈體極虛患溫而胸次痞悶苔黃垢膩醫皆畏難而退孟英以輕清肅化之藥數劑苔退胸舒即能進粥隨予生津養血又旬日更衣而愈觀此則黃苔宜下之說須合脈體以為可否也曹氏婦孀居而操家政人極精幹患恙旬余諸醫以為冬溫而多藥罔瘥勢瀕於危伊親家孫位申速孟英挽之面赤耳聾脈狀細軟舌赤無液粒米不沾夜不成眠便溏浸赤痰咸咳逆腹脹氣衝齦腫巔疼音低自汗口中甚辣心下如焚兩足不溫時欲發暈乃肝腎素虧心陽內亢原非感證藥誤已深縱是冬溫亦不可妄施柴葛況足冷麵赤非渾身發熱之比也既耗其氣更爍其營陰火潛燃治宜鎮息方以參蠣連芍茹冬楝斛丹參小麥龜板鱉甲煎吞磁朱丸一飲脹消餘證不減去楝芍龜板鱉甲加龍齒銀花導赤散三服暈止便堅小溲亦暢略安寢食再去銀花木通磁朱丸加知柏紅棗紫石英而麥冬以硃砂染兩帖火降足和舌色漸潤又兩帖汗嗽胥減心下始涼乃易生地以熟地滋補而瘳葉茂栽年三旬余寒熱時形身振多汗醫從瘧治數日而危速孟英視之脈微欲脫語難出聲舌光無苔筋惕肉瞤亟宜救逆合建中湯灌之覆杯即愈續服多劑培補而安翁某年甫冠仲冬患感醫與溫散藥數帖神悗耳聾苔黑便瀉胸痞腹脹溲少妄言孟英切脈細數而澀乃暑濕內伏氣鬱不宣也投以犀角銀花元參連翹菖蒲鬱金黃連藥一劑熱退神清脘不拒按別恙未減脈則弦細而數口轉發渴改用芩翹樸斛連楝銀花通草蘭葉冬瓜皮為劑兩啜化為間瘧其瘧發一次則苔化一層脹減一分粥加一盞藥不更張凡四發而苔淨脹消脈和溲暢嗣予調養而康潘嫗久患痛吐多藥莫痊孟英視之脈弦勁而數曰口苦而渴乎大便不暢乎小溲如沸乎病者云誠然第冷氣時沖欲嘔不暢渴喜飲沸吐沫極酸總由積寒深重耳孟英曰因此諒諸醫必用溫燥之藥矣須知氣衝覺冷者熱極似寒渴欲飲沸者飲邪內踞吐沫作酸者曲直所化其病在絡故吐之不易方以茹旋梔楝枇杷葉絲瓜絡木通生薑衣海䖳鳧茈蘇葉炒黃連煎吞當歸龍薈丸一劑知五劑愈張氏婦先於四月間患嘔吐醫以為寒疊進薑萸之藥致血溢自汗丐孟英診之脈甚滑按之不絕舌光無苔曰孕也詢其經事果愆兩度予沙參枇杷葉生地蘆根連蘇旋斛之劑而安仲冬舉一男胎前即患痰嗽娩後招專科治之服四物湯增損多劑而氣逆礙眠嗽則汗出便溏遺溺口渴不飢再乞援於孟英脈洪大按之虛軟授沙參石英黃耆苡仁甘草牡蠣石斛茯苓小麥紅棗冬蟲夏草之方兩帖而汗收安穀四帖而渴減便堅旬余遂愈朱慶雲室年六十六歲初發熱即舌赤無津錢丁任顧諸醫胥云高年液少津涸堪憂甘潤之方連投八劑馴致神悗耳聾不飲不食沉沉欲寐呃忒面紅勢已瀕危徐德生囑其延孟英圖之審其脈弦滑而數視其舌絳而捫之甚燥然體豐呼吸不調呃聲亦不暢達合脈證與體而論之雖無脘悶拒按之候確是肝陽內熾痰阻樞機液不上承非津涸也劑以小陷胸湯加茹薤旋菖枇杷葉蘇葉一飲而夜得微汗身熱即退次日痰嗽大作舌滑流涎病家詫曰奇矣許多潤藥求其潤而愈燥何以此劑一投而反津津若是耶殆仙丹矣三帖後更衣呃止痰嗽亦減漸進稀粥改用沙參紫菀苡斛歸茹麥冬冬瓜子服數帖溲暢餐加而覺肢麻頭暈予參耆杞歸芍橘半熟地天麻石英牛膝茯苓桑枝補虛息風化痰而健朱逵士令正懷妊八月脘痛便溏跗腫腰疼頻吐綠水溫補不效孟英診之脈軟而弦舌絳無液口乾少寐形瘦神疲木土相乘陰液大耗雖宜培養燥烈禁施以參連歸斛杜仲靈脾冬蟲夏草柏橘茹英為劑果各恙遞安脘舒瀉止加以熟地舌漸生津而愈黃漱莊司馬素患左目失明今春右目患障多藥未瘳延至秋間孟英視曰脈甚弦滑痰火之疴溫補宜停庶免瞽患奈司馬性喜溫補不以為然漸至耳亦失聰冬季再請孟英往診右目但能視碗大之字稍小者不能見矣耳則雖對面撞鐘放炮胥無聞也且巔腫而疼時咳白沫脈來搏勁不撓見其案頭有顧某所定丸方用藥四十味皆貴重溫補及血肉之品蓋其病在絡不在藏府故服此如膠似漆之藥僅能錮疾成廢而無性命之虞也聞辛亥春許辛泉患類中諸醫僉從虛治孟英診脈沉滑而數且體厚苔黃亟宜化痰清熱疏方畢人皆不以為然惟其子秋蘆極佩服云五年前家父患恐懼多疑曾屈診視方案猶存若合符節只因家父性喜溫補前之病根不拔釀成今日之疴先生卓見不可及也奈病者依然不悟不刈根株延至壬子夏復中而殞年未五旬也並識之以為不究病情好服溫補者鑑施瀛洲體豐色白夏月在紹患瀉醫進參朮桂附熟地四神之類略無寸效季冬來杭就診於孟英其脈微弱左手及右尺沉取有弦數之象眩暈形消舌色深紫無苔不渴納食腹脹溲少而赤瀉必腸鳴中氣固虛理應投補但不可佐滋膩以滯中樞而助其溜下之勢又不宜雜燥熱以煽風陽而壯其食氣之火予參耆朮苡升柴苓澤香連為劑吞通關丸乃宣清升降補運兼施之法也服之良效浹旬舌淡溲行脹消暈止惟大便未實耳去苓澤升柴香連通關丸加菟絲木瓜橘皮黃柏石脂白芍善後而瘳兩間之事兩兩間之理為之故有一事必有一理無可假也王丈孟英之處事必曰近人情蓋近情即不遠於理矣丈內行純篤人無閒言其精於醫也孳孳焉以濟世為懷駸駸乎入古人之室貧而得肆其志肥遁無不利焉醫案三編梓成吾祖既序之益孫幼蒙期許今逾壯歲方愧理未明情未協顧猶不以為不肖命贅數語於後謹述平昔之得聞於丈者以志三世至交不勝欽佩云世晚莊益孫謹跋弟王士俊季傑校字
